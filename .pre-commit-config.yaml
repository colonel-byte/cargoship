---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: vendor/.*
        args:
          - "--maxkb=1024"
      - id: check-merge-conflict
      - id: detect-aws-credentials
        exclude: vendor/.*
        args:
          - "--allow-missing-credentials"
      - id: fix-byte-order-marker
        exclude: vendor/.*
      - id: end-of-file-fixer
        exclude: |-
          (?x)^(
              vendor/.*|
              docs/phases/.*|
              docs/commands/.*
          )$
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
        exclude: |-
          (?x)^(
              vendor/.*|
              docs/phases/.*
          )$
  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-smartquotes
        exclude: vendor/.*
  - repo: https://github.com/google/addlicense
    rev: v1.2.0
    hooks:
      - id: addlicense
        exclude: vendor/.*
        exclude_types:
          - yaml
        args:
          - -c
          - colonel-byte
          - -l
          - apache
          - -y
          - "2026"
  - repo: https://github.com/google/keep-sorted
    rev: v0.10.0
    hooks:
      - id: keep-sorted
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.1
    hooks:
      - id: golangci-lint
        exclude: vendor/.*
      - id: golangci-lint-config-verify
        exclude: vendor/.*
  - repo: local
    hooks:
      - id: schema-generator
        name: generate-schemas
        language: system
        pass_filenames: false
        entry: mage generate:schema
      - id: docs-generator
        name: generate-docs
        language: system
        pass_filenames: false
        entry: bash -c "CARGOSHIP_CONFIG=hack/config.yaml mage generate:document"
