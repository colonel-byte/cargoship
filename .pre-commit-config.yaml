---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: vendor/.*
        args:
          - "--maxkb=1024"
      - id: check-merge-conflict
      - id: detect-aws-credentials
        exclude: vendor/.*
        args:
          - "--allow-missing-credentials"
      - id: fix-byte-order-marker
        exclude: vendor/.*
      - id: end-of-file-fixer
        exclude: |-
          (?x)^(
              vendor/.*|
              docs/phases/.*|
              docs/commands/.*
          )$
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
        exclude: |-
          (?x)^(
              vendor/.*|
              docs/phases/.*
          )$
  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-smartquotes
        exclude: vendor/.*
  - repo: https://github.com/google/addlicense
    rev: v1.2.0
    hooks:
      - id: addlicense
        exclude: |-
          (?x)^(
              vendor/.*|
              thirdparty-src/.*|
              hack/completion/.*
          )$
        exclude_types:
          - yaml
        args:
          - -c
          - colonel-byte
          - -l
          - apache
          - -y
          - "2026"
  - repo: https://github.com/google/keep-sorted
    rev: v0.10.0
    hooks:
      - id: keep-sorted
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0
    hooks:
      - id: golangci-lint
        language_version: "1.27.0"
        exclude: vendor/.*
      - id: golangci-lint-config-verify
        language_version: "1.27.0"
        exclude: vendor/.*
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # Errors only, and deliberately not the formatter. All of this repository's Python is Ansible
      # action plugins, written against ansible-core's plugin API: a style rule would have opinions
      # about that API, and a formatter would rewrite files whose shape is dictated by it. What is
      # wanted is the class of mistake nothing else here catches -- an unused import, a name that
      # does not exist, an assignment nothing reads -- which is pyflakes (F) plus ruff's syntax and
      # IO errors (E9).
      - id: ruff-check
        args:
          - --select=F,E9
          - --target-version=py39
        exclude: vendor/.*
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        exclude: vendor/.*
  - repo: local
    hooks:
      - id: schema-generator
        name: generate-schemas
        language: system
        pass_filenames: false
        entry: go run ./magefiles/core generate:schema
      - id: shell-completion-generator
        name: generate-shell-completion
        language: system
        pass_filenames: false
        entry: go run ./magefiles/core generate:completion
      - id: docs-generator
        name: generate-docs
        language: system
        pass_filenames: false
        entry: bash -c "CARGOSHIP_MAGE_DOCS_CHILD=1 CARGOSHIP_CONFIG=hack/config.yaml go run ./magefiles/core generate:document"
