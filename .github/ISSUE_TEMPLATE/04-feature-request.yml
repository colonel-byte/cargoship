name: Feature or enhancement request
description: Something cargoship should be able to do and cannot.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and where cargoship stops you. Describe this before the solution - the problem usually has more than one answer.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The command, flag, config field, or behaviour you have in mind. A sketch of the invocation or the YAML is worth more than a paragraph.
    validations:
      required: true
  - type: checkboxes
    id: surfaces
    attributes:
      label: Which surfaces this touches
      description: A change that crosses into the Ansible collection or the OpenTofu provider is a materially bigger one than a CLI-only change.
      options:
        - label: The cargoship CLI
        - label: The colonel_byte.cargoship Ansible collection
        - label: The OpenTofu provider
        - label: The package format or the phases that consume it
        - label: The YAML configs and their JSON schemas
        - label: Documentation
        - label: Not sure
  - type: dropdown
    id: engine
    attributes:
      label: Kubernetes engine
      options:
        - K3s
        - RKE2
        - Upstream kubeadm
        - Not engine-specific
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: The workaround, the hand-written script, or the manual step this would replace. Say so if there is no workaround.
  - type: checkboxes
    id: offer
    attributes:
      label: Implementation
      options:
        - label: I would be willing to open a pull request for this
