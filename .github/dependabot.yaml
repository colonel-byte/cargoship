---
version: 2
registries:
  docker-hub:
    type: docker-registry
    url: registry.hub.docker.com
    username: ${{ secrets.DOCKER_HUB_USER }}
    password: ${{ secrets.DOCKER_HUB_TOKEN }}
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    allow:
      - dependency-type: "all"
    ignore:
      # gobwas/glob v1.0.0 removed the Glob interface type; vendored
      # open-policy-agent/opa (transitive via sigstore/cosign) still uses it.
      - dependency-name: "github.com/gobwas/glob"
        update-types: ["version-update:semver-major"]
    groups:
      zarf:
        patterns:
          - "github.com/zarf-dev/*"
      k8s:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      golang:
        patterns:
          - "golang.org/x/*"
          - "google.golang.org/*"
      docker:
        patterns:
          - "github.com/docker/*"
          - "github.com/moby/*"
          - "github.com/fvbommel/sortorder"
      cosign:
        patterns:
          - "github.com/aws/*"
          - "github.com/awslabs/*"
          - "github.com/Azure/*"
          - "github.com/sigstore/*"
          - "github.com/spiffe/*"
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      misc:
        patterns:
          - "*"
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    assignees:
      - "a1994sc"
    groups:
      core:
        patterns:
          - "*"
  - package-ecosystem: docker
    directories:
      - "/containers/base"
      - "/containers/ubi"
    registries:
      - docker-hub
    schedule:
      interval: daily
    groups:
      core:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    groups:
      core:
        patterns:
          - "*"
