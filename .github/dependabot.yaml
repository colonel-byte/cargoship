---
version: 2
registries:
  docker-hub:
    type: docker-registry
    url: registry.hub.docker.com
    username: ${{ secrets.DOCKER_HUB_USER }}
    password: ${{ secrets.DOCKER_HUB_TOKEN }}
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: daily
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 50
    groups:
      k8s:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      sigstore:
        patterns:
          - "github.com/sigstore/*"
      golang:
        patterns:
          - "golang.org/x/*"
      docker:
        patterns:
          - "github.com/docker/*"
          - "github.com/moby/*"
          - "github.com/containerd/*"
      cloud-kms:
        patterns:
          - "github.com/aws/*"
          - "github.com/Azure/*"
          - "cloud.google.com/go/*"
      openapi:
        patterns:
          - "github.com/go-openapi/*"
    ignore:
      # gobwas/glob v1.0.0 removed the Glob interface type; open-policy-agent/opa
      # used it, transitively via sigstore/cosign's rego policy evaluation.
      #
      # Dormant: nothing requires glob since cosign's CLI command structs stopped
      # being linked. Kept because the path back is live -- issue #848 may restore
      # keyless verification, and doing that through those structs relinks opa.
      - dependency-name: "github.com/gobwas/glob"
        update-types: ["version-update:semver-major"]
      # crypto11 is stuck at v1.2.5: the upstream repo was renamed twice, and
      # every tag after v1.2.5 declares a different module path, so Dependabot
      # fails the whole run with go_module_path_mismatch. Nothing newer resolves
      # under this path until cosign re-imports the renamed module.
      #
      # Dormant: nothing requires crypto11 since cosign's CLI command structs
      # stopped being linked -- it arrived with their PKCS#11 (--sk) support. Kept
      # deliberately rather than deleted, because the failure it prevents takes out
      # the whole daily run rather than one pull request, and issue #848 may relink
      # those structs. A line that matches nothing costs less than that outage.
      # See docs/agent/choice-crypto11-rename.md before touching this.
      - dependency-name: "github.com/ThalesIgnite/crypto11"
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    groups:
      core:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/.github/commitlint"
    schedule:
      interval: weekly
    groups:
      commitlint:
        patterns:
          - "*"
  # One entry per directory, ungrouped: Dependabot appends "in the <name> group
  # across N directories" to PR titles when `directories` and `groups` are set,
  # pushing the title past commitlint's 100-char header-max-length.
  - package-ecosystem: docker
    directory: "/containers/ansible"
    schedule:
      interval: daily
    registries:
      - docker-hub
  - package-ecosystem: docker
    directory: "/containers/base"
    schedule:
      interval: daily
    registries:
      - docker-hub
  - package-ecosystem: docker
    directory: "/containers/deb"
    schedule:
      interval: daily
    registries:
      - docker-hub
  - package-ecosystem: docker
    directory: "/containers/ubi"
    schedule:
      interval: daily
    registries:
      - docker-hub
