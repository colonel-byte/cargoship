---
version: 2
registries:
  docker-hub:
    type: docker-registry
    url: registry.hub.docker.com
    username: ${{ secrets.DOCKER_HUB_USER }}
    password: ${{ secrets.DOCKER_HUB_TOKEN }}
  registry1:
    type: docker-registry
    url: registry1.dso.mil
    username: ${{ secrets.REGISTRY1_USER }}
    password: ${{ secrets.REGISTRY1_TOKEN }}
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: daily
    allow:
      - dependency-type: "all"
    ignore:
      # gobwas/glob v1.0.0 removed the Glob interface type; vendored
      # open-policy-agent/opa (transitive via sigstore/cosign) still uses it.
      - dependency-name: "github.com/gobwas/glob"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    groups:
      core:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/.github/commitlint"
    schedule:
      interval: weekly
    groups:
      commitlint:
        patterns:
          - "*"
  # One entry per directory, ungrouped: Dependabot appends "in the <name> group
  # across N directories" to PR titles when `directories` and `groups` are set,
  # pushing the title past commitlint's 100-char header-max-length.
  - package-ecosystem: docker
    directory: "/containers/ansible"
    schedule:
      interval: daily
    registries:
      - docker-hub
      - registry1
  - package-ecosystem: docker
    directory: "/containers/base"
    schedule:
      interval: daily
    registries:
      - docker-hub
      - registry1
  - package-ecosystem: docker
    directory: "/containers/deb"
    schedule:
      interval: daily
    registries:
      - docker-hub
      - registry1
  - package-ecosystem: docker
    directory: "/containers/ubi"
    schedule:
      interval: daily
    registries:
      - docker-hub
      - registry1
