---
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
    schedule:
      interval: weekly
      day: monday
    assignees:
      - "a1994sc"
    allow:
      - dependency-type: "all"
    groups:
      zarf:
        patterns:
          - "github.com/zarf-dev/*"
      k8s:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      golang:
        patterns:
          - "golang.org/x/*"
      docker:
        patterns:
          - "github.com/docker/*"
      misc:
        patterns:
          - "*"
  - package-ecosystem: pre-commit
    directories:
      - "/"
    schedule:
      interval: daily
    assignees:
      - "a1994sc"
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: daily
    assignees:
      - "a1994sc"
