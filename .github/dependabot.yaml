---
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "**/*"
    schedule:
      interval: weekly
      day: friday
    allow:
      - dependency-type: "all"
    groups:
      k8s:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      golang:
        patterns:
          - "golang.org/x/*"
      docker:
        patterns:
          - "github.com/docker/*"
      aws:
        patterns:
          - "github.com/aws/*"
          - "github.com/awslabs/*"
      azure:
        patterns:
          - "github.com/Azure/*"
      openapi:
        patterns:
          - "github.com/go-openapi/*"
      hashicorp:
        patterns:
          - "github.com/hashicorp/*"
      sigstore:
        patterns:
          - "github.com/sigstore/*"
  - package-ecosystem: pre-commit
    directories:
      - "/"
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
