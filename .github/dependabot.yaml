---
version: 2
updates:
  - package-ecosystem: gomod
    # vendor: true
    directories:
      - "/"
      - "/.dagger/"
    schedule:
      interval: daily
    allow:
      - dependency-type: "all"
    groups:
      k8s:
        patterns:
          - "k8s.io/*"
      golang:
        patterns:
          - "golang.org/x/*"
      docker:
        patterns:
          - "github.com/docker/*"
  - package-ecosystem: pre-commit
    directories:
      - "/"
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
