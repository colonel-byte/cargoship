---
name: PR Title Check

on:
  pull_request:
    # milestoned is added here as a workaround for release-please not triggering PR workflows (PRs should be added to a milestone to trigger the workflow).
    types:
      - milestoned
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

jobs:
  title_check:
    # if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

      - name: Install commitlint
        working-directory: .github/commitlint
        run: npm ci

      # This lints the PR title, not individual commits, since release-please squash-merges
      # and the PR title becomes the final commit message. wagoid/commitlint-github-action
      # lints commit messages instead, so it isn't a drop-in replacement for this step.
      - name: Lint PR title
        working-directory: .github/commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint
