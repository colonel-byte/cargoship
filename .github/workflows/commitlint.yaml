---
name: PR Title Check

on:
  pull_request:
    # milestoned is added here as a workaround for release-please not triggering PR workflows (PRs should be added to a milestone to trigger the workflow).
    types:
      - milestoned
      - opened
      - reopened
      - synchronize
      - edited
  # Required status check, so the merge queue waits for a `title_check` result on the
  # merge_group ref too. There is no pull request under that event -- the steps below are
  # skipped and the job reports success, since the title was already linted on the pull
  # request that got queued.
  merge_group:

permissions:
  contents: read

jobs:
  title_check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

      - name: Install commitlint
        if: github.event_name == 'pull_request'
        working-directory: .github/commitlint
        run: npm ci

      # This lints the PR title, not individual commits, since release-please squash-merges
      # and the PR title becomes the final commit message. wagoid/commitlint-github-action
      # lints commit messages instead, so it isn't a drop-in replacement for this step.
      #
      # Dependabot gets .commitlintrc.dependabot.yaml, which is the same config with
      # header-max-length off: it cannot shorten a module path, and ten of the modules in
      # go.mod overflow a 100-char title. Skipping the job for it instead would leave
      # title_check without a result, and that is a required status check on main. See
      # docs/agent/choice-dependabot-title-length.md.
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        working-directory: .github/commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          config=.commitlintrc.yaml
          if [ "${PR_AUTHOR}" = "dependabot[bot]" ]; then
            config=.commitlintrc.dependabot.yaml
          fi
          echo "$PR_TITLE" | npx commitlint --config "${config}"
