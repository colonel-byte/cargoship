---
name: Test build containers

# Dependabot's docker ecosystem entries in .github/dependabot.yaml bump one FROM line (or
# package pin) per PR, and GitHub auto-labels every docker-ecosystem PR "docker". Neither
# check-base-image-label.yaml (text diff) nor scan-lint.yaml's hadolint job (syntax only)
# actually builds the image, so a bump that breaks the build isn't caught until release.
#
# These Dockerfiles are written for goreleaser's dockers_v2 pipe, not a plain `docker build`:
# containers/ansible, containers/deb, and containers/ubi COPY nfpm-produced *.rpm/*.deb out
# of a ${TARGETPLATFORM} directory that only goreleaser stages, and containers/ansible/ubi
# also pull extra_files goreleaser injects. That pipe has no per-image build flag, so a
# snapshot release builds all four images together in one pass -- there is no cheaper way to
# build "just the one that changed" without reimplementing goreleaser's context staging.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
    paths:
      - "containers/**"
      - ".goreleaser.yaml"
      - ".github/workflows/test-build-containers.yaml"

permissions:
  contents: read

concurrency:
  group: test-build-containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # `labeled` is in `types` because Dependabot's `docker` label lands after the PR is
    # opened -- without it this `if` is evaluated (and fails) on the `opened` event before
    # the label exists, and nothing re-runs it once the label is added.
    if: contains(github.event.pull_request.labels.*.name, 'docker')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # Pulling containers/base and containers/ubi's FROM images needs registry1 auth; deb's
      # nfpm registry lookups don't, but docker.io is logged into for parity with release.yaml
      # and to dodge anonymous-pull rate limits. No ghcr.io login: snapshot mode never pushes.
      - name: Login to Registry1
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry1.dso.mil
          username: ${{ secrets.REG_ONE_USER }}
          password: ${{ secrets.REG_ONE_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # --snapshot implies skipping publish/validate/announce: nfpm still builds the
      # rpm/deb/apk packages and the dockers_v2 pipe still runs buildx build for all four
      # images, but nothing is pushed. --skip=sign,sbom avoids failing on the absent cosign
      # key, which this workflow has no reason to hold.
      - name: Run GoReleaser (snapshot build only)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          args: release --snapshot --clean --skip=sign,sbom
