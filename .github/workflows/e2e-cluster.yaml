---
name: E2E cluster

# The install group, test/e2e/cluster, which provisions a bootloose cluster of Docker machines
# and walks the apply phase list one phase at a time against it. This workflow runs only the
# staging half: it uploads the package and renders the engine config on every OS family, and
# stops before the engine starts anywhere. It has its own workflow rather than a gated job in
# e2e.yaml so that its trigger, its concurrency group and its time budget are independent of the
# checks that do run on every push.
#
# The engine-bootstrap half -- installing k3s and bringing the cluster up, then joining a machine
# to the running cluster -- is not run here. It is not reliable enough on a free hosted runner to
# be a required check, even after switching from a three-controller rke2 topology to a
# single-controller k3s one to remove the etcd raft quorum timeouts that motivated that switch.
# It still exists and is still worth running: on a local box, with `mage test:endToEndCluster`.
# See docs/dev/e2e-phase-tests.md and docs/agent/choice-e2e-stage-split.md for the reasoning and
# the local instructions.
#
# The one job below runs on demand from the Actions tab and on every pull request -- no label
# needed. It used to sit behind an "e2e-cluster" label alongside a second, full-install job while
# its own cost and reliability were unproven; that data is in now, so the gate is gone and the
# full-install job was removed rather than kept as a manual option. See
# docs/agent/choice-e2e-stage-split.md.
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - "**.md"
      - "**.jpg"
      - "**.png"
      - "**.gif"
      - "**.svg"
      - "adr/**"
      - "docs/**"
      - "CODEOWNERS"

permissions:
  contents: read

concurrency:
  group: e2e-cluster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The staging half of the suite, over the five-machine inventory: it uploads the package and
  # renders the engine config without starting an engine anywhere. No build step -- the suite
  # calls the cargoship packages directly, distro.Create to build the package and
  # action.NewPrepare and action.NewApply around the phase walk, so there is no binary for this
  # workflow to produce or download. That is what makes it independent of e2e.yaml, which is the
  # point of the split.
  e2e-cluster-stage:
    runs-on: ubuntu-latest
    # It starts no engine, so this wants a fraction of what the engine-bootstrap half would
    # need on a local run. The suite's own timeout is below it, so an overrun is reported as a
    # Go test failure naming the phase it was in rather than as a cancelled job.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The package the suite builds and stages on every node runs to gigabytes, which is more
      # than the ~14GB a hosted runner leaves free comfortably holds.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - name: Test
        run: >-
          go test -mod=vendor -count=1 -v -timeout=25m
          ./test/e2e/cluster/...
        env:
          # Provision the five-machine inventory and stop before the engine phases. See
          # stageOnlyEnvVar in test/e2e/cluster/main_test.go.
          CARGOSHIP_E2E_STAGE_ONLY: "1"
          # Leave the machines standing when the run fails, so the step below can read them.
          # See keepClusterEnvVar in the same file.
          CARGOSHIP_E2E_KEEP_CLUSTER: "1"
          # Everything the test build needs is vendored, so make any accidental network
          # access fail fast. Matches magefiles/utils.go.
          CGO_ENABLED: 0
          GOFLAGS: -mod=vendor
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: local

      # Nothing on these nodes was started, so there is no engine unit to read -- df, free and
      # the container list are what a full disk or an exhausted runner look like here.
      - name: Collect node diagnostics
        if: failure()
        run: |
          diag="$RUNNER_TEMP/diagnostics"
          mkdir -p "$diag"
          df -h / | tee "$diag/df.txt"
          free -h | tee "$diag/free.txt"
          docker ps -a | tee "$diag/containers.txt"
          for c in $(docker ps -aq --filter label=io.k0sproject.bootloose.owner=bootloose); do
            name=$(docker inspect -f '{{.Name}}' "$c" | tr -d /)
            docker logs "$c" > "$diag/$name.docker.log" 2>&1 || true
            echo "::group::$name"
            tail -n 200 "$diag/$name.docker.log" || true
            echo "::endgroup::"
          done
          cp -r "$HOME/.cargoship-cache/logs" "$diag/suite-logs" 2>/dev/null || true

      - name: Upload node diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-cluster-stage-diagnostics
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove leftover bootloose containers
        if: always()
        run: |
          ids=$(docker ps -aq --filter label=io.k0sproject.bootloose.owner=bootloose)
          if [ -n "$ids" ]; then
            docker rm -fv $ids
          fi
