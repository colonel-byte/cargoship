---
name: goreleaser

on:
  push:
    tags:
      - "*"

# Read only at the top so that a job has to ask for what it writes. See the job blocks
# below for what each one needs and why.
permissions:
  contents: read

jobs:
  goreleaser:
    # contents: write creates the release and uploads the archives, packages: write pushes
    # the images, and id-token: write is the OIDC token cosign signs against.
    permissions:
      contents: write
      packages: write
      # issues: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Setup golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Registry1
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry1.dso.mil
          username: ${{ secrets.REG_ONE_USER }}
          password: ${{ secrets.REG_ONE_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 #v7.2.3
        with:
          distribution: goreleaser
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}

  # Publishing an example exercises the release that was just cut, so it has to wait for the
  # archives: setup-cargoship installs the released CLI, and needs is what guarantees
  # goreleaser has uploaded it. Version tags only -- goreleaser takes every tag, while
  # release-please only ever pushes vN.N.N, and a tag with no release behind it has nothing
  # for setup-cargoship to resolve.
  #
  # secrets: inherit passes the Cosign key the publish step signs with. Permissions are not
  # set here: the called workflow declares the contents: read, packages: write it needs,
  # which is a narrowing of what this workflow already grants.
  publish-example:
    # A caller's grant is the ceiling for the workflow it calls -- permissions can be held
    # or narrowed down the chain, never widened -- so this has to cover what
    # publish-example.yaml's own job asks for, and it is written to match it exactly.
    permissions:
      contents: read
      packages: write
    needs: goreleaser
    if: startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/publish-example.yaml
    secrets: inherit
