---
name: goreleaser

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write
  # issues: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Setup ansible-core
        run: pipx install ansible-core

      - name: Setup golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Registry1
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry1.dso.mil
          username: ${{ secrets.REG_ONE_USER }}
          password: ${{ secrets.REG_ONE_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Setup package signing keys
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          APK_RSA_PRIVATE_KEY: ${{ secrets.APK_RSA_PRIVATE_KEY }}
        run: |
          # nfpm's signature.key_file takes a path, not key material, so unlike the cosign
          # secrets these have to land on disk. RUNNER_TEMP is outside the checkout, so
          # nothing written here can be swept up by a glob in .goreleaser.yaml.
          #
          # Two keys, because nfpm signs rpm and deb with OpenPGP but apk with a bare RSA
          # key. See the note on apk.signature in .goreleaser.yaml.
          #
          # A missing secret leaves its *_KEY_PATH unset, which the
          # `{{ if ne (index .Env ...) "" }}` guards in .goreleaser.yaml read as "do not
          # sign". That keeps releases working before the keys exist, at the cost of
          # signing being absent rather than loud -- hence the warnings.
          umask 077
          if [ -n "${GPG_PRIVATE_KEY}" ]; then
            printf '%s\n' "${GPG_PRIVATE_KEY}" > "${RUNNER_TEMP}/cargoship-signing.asc"
            echo "GPG_KEY_PATH=${RUNNER_TEMP}/cargoship-signing.asc" >> "${GITHUB_ENV}"
          else
            echo "::warning::GPG_PRIVATE_KEY is unset; the rpm and deb will be unsigned"
          fi
          if [ -n "${APK_RSA_PRIVATE_KEY}" ]; then
            printf '%s\n' "${APK_RSA_PRIVATE_KEY}" > "${RUNNER_TEMP}/cargoship-apk.rsa"
            echo "APK_RSA_KEY_PATH=${RUNNER_TEMP}/cargoship-apk.rsa" >> "${GITHUB_ENV}"
          else
            echo "::warning::APK_RSA_PRIVATE_KEY is unset; the apk will be unsigned"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 #v7.2.3
        with:
          distribution: goreleaser
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          # Only consulted when the OpenPGP key is passphrase-protected; nfpm ignores it
          # for an unprotected key, so leaving the secret unset is fine. There is no apk
          # equivalent -- that key cannot be encrypted at all.
          NFPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Remove package signing keys
        if: always()
        run: rm -f "${RUNNER_TEMP}/cargoship-signing.asc" "${RUNNER_TEMP}/cargoship-apk.rsa"
