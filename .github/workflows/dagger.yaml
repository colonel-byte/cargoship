---
name: Dagger builds

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "*.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Dagger Version
        id: dagger_version
        run: |-
          echo "version=$(jq -r '.engineVersion' dagger.json)"
          echo "version=$(jq -r '.engineVersion' dagger.json)" >> $GITHUB_OUTPUT

      - name: Create dirs
        run: |-
          mkdir -p bin

      - name: Build all versions
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ steps.dagger_version.outputs.version }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          verb: call
          # ubuntu-latest runners have 4 vCPUs; cap concurrency there so the 6 platform
          # builds don't oversubscribe the runner and contend harder on the shared
          # go-build cache volume than they need to.
          args: build --concurrency=4
