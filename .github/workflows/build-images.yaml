---
name: Publish Images

on:
  schedule:
    # Runs at 00:00 UTC every Monday
    - cron: '0 0 * * 1'
  pull_request:
    paths:
      - 'src/internal/container/**/Dockerfile'
  push:
    branches:
      - main
    paths:
      - 'src/internal/container/**/Dockerfile'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tag: ${{ steps.tag.outputs.TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine Build Tag
        id: tag
        env:
          sha: ${{ github.sha }}
          job: ${{ github.run_number }}
        run: |-
          echo "TAG=$(echo $job-${sha:0:8})"
          echo "TAG=$(echo $job-${sha:0:8})" >> $GITHUB_OUTPUT

      - id: set-matrix
        env:
          IMG_DIR: src/internal/container
        run: |-
          echo "matrix={\"include\":[$(ls -d src/internal/container/* | awk -F/ '{printf "%s{\"img\":\"%s\", \"name\": \"%s\" }", sep, $0, $(NF); sep=","} END {print ""}')]}"
          echo "matrix={\"include\":[$(ls -d src/internal/container/* | awk -F/ '{printf "%s{\"img\":\"%s\", \"name\": \"%s\" }", sep, $0, $(NF); sep=","} END {print ""}')]}" >> $GITHUB_OUTPUT

  release:
    needs:
      - setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.img }}
          push: true
          tags: |-
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/bootloose/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/bootloose/${{ matrix.name }}:${{ needs.setup.outputs.tag }}
          no-cache: true
