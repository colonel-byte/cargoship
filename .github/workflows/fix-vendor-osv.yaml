---
name: Fix vendored osv-scanner overrides

# Dependabot re-runs `go mod vendor` for every gomod update. That deletes and recreates
# vendor/, which takes the four generated osv-scanner.toml files with it, and check-go-mod's
# dev:verifyVendor step then fails a pull request nobody can fix without a manual commit. See
# PRs #464 and #465, where that commit was made by hand. This job makes it instead.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - vendor/**

# pull_request_target runs against the base branch with a token that can write, so the job
# below never fetches the pull request at all. It generates the overrides from the base
# checkout and commits them through the git data API, which needs the four file contents and
# nothing else. Checking the pull request out would put a freshly bumped dependency's tree on
# a runner that holds a write token, which is the failure pull_request_target is known for.
permissions:
  contents: read

concurrency:
  group: fix-vendor-osv-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    # Dependabot branches live in this repository, so the app token can push to them. A fork
    # cannot be pushed to at all, and no other actor re-vendors on a schedule.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Get token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_GITHUB_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_GITHUB_APP_SECRET }}

      # No ref: on a pull_request_target run the default is the tip of the base branch, which
      # is the tree this job is allowed to execute. Naming a ref out of the event payload
      # would say "check something out of the pull request" even when the sha named is the
      # base one, and that is what scorecard's Dangerous-Workflow check reads.
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The overrides are rendered from osvOverrides in magefiles/vendor-osv.go, which no
      # dependency bump touches, so the base branch produces exactly the bytes dev:verifyVendor
      # wants. This also fixes an override edited by hand, not only a deleted one.
      - name: Generate overrides
        run: go run ./magefiles/core dev:writeOSVOverrides

      - name: Commit the overrides to the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The head sha is read now rather than taken from the event payload, so the commit
          # is parented on what the branch actually points at. If dependabot pushes again
          # while this runs, the ref update below is no longer a fast-forward and fails loudly
          # instead of overwriting the newer commit.
          head_sha="$(gh api "repos/${REPO}/git/ref/heads/${HEAD_REF}" --jq '.object.sha')"
          head_tree="$(gh api "repos/${REPO}/git/commits/${head_sha}" --jq '.tree.sha')"

          # A directory missing from the pull request means the bump dropped the module
          # entirely. Recreating it would leave an override beside no manifest, so skip it and
          # let dev:verifyVendor fail: that case needs the entry removed from
          # magefiles/vendor-osv.go. An override already matching the generated bytes is
          # skipped too, which is what keeps a synchronize run from committing a no-op.
          entries='[]'
          while IFS= read -r -d '' file; do
            dir="$(dirname "${file}")"
            listing="$(gh api "repos/${REPO}/contents/${dir}?ref=${head_sha}" 2>/dev/null || true)"
            if [ -z "${listing}" ]; then
              echo "skipping ${file}: ${dir} is not vendored by this pull request"
              continue
            fi

            current="$(printf '%s' "${listing}" |
              jq -r 'if type == "array"
                     then (.[] | select(.name == "osv-scanner.toml") | .sha)
                     else empty
                     end')"
            if [ "${current}" = "$(git hash-object "${file}")" ]; then
              continue
            fi

            blob="$(gh api "repos/${REPO}/git/blobs" \
              -f encoding=base64 -f content="$(base64 -w0 "${file}")" --jq '.sha')"
            entries="$(printf '%s' "${entries}" |
              jq --arg path "${file}" --arg sha "${blob}" \
                '. + [{path: $path, mode: "100644", type: "blob", sha: $sha}]')"
          done < <(find vendor -name osv-scanner.toml -print0)

          if [ "$(printf '%s' "${entries}" | jq 'length')" -eq 0 ]; then
            echo "overrides already current, nothing to push"
            exit 0
          fi

          # The numeric id is what attributes the commit to the app. Without it the ruleset
          # counts the change as unattributed and asks for an extra approval.
          app_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          author="${APP_SLUG}[bot]"
          email="${app_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          tree="$(jq -n --arg base "${head_tree}" --argjson entries "${entries}" \
            '{base_tree: $base, tree: $entries}' |
            gh api "repos/${REPO}/git/trees" --input - --jq '.sha')"

          commit="$(jq -n \
            --arg tree "${tree}" \
            --arg parent "${head_sha}" \
            --arg name "${author}" \
            --arg email "${email}" \
            '{message: "ci: readd the osv scanner artifacts\n\nSigned-off-by: \($name) <\($email)>",
              tree: $tree,
              parents: [$parent],
              author: {name: $name, email: $email},
              committer: {name: $name, email: $email}}' |
            gh api "repos/${REPO}/git/commits" --input - --jq '.sha')"

          gh api --method PATCH "repos/${REPO}/git/refs/heads/${HEAD_REF}" \
            -f "sha=${commit}" --jq '.object.sha'
