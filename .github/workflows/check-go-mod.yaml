name: Check for go mod changes

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate-go-mod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test go mod
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # vendor/ carries four generated osv-scanner.toml files that keep the Scorecard
      # Vulnerabilities check reporting on cargoship rather than on the JavaScript and Python
      # tooling its Go dependencies ship in their own repositories. go mod vendor deletes them,
      # so this fails the pull request that dropped one, and fails on a new dependency that
      # brings in a lockfile nothing covers yet. See magefiles/vendor-osv.go.
      #
      # Dependabot re-vendors on every gomod update, so it trips the first case every time.
      # fix-vendor-osv.yaml pushes the regenerated files back onto its branch, which makes this
      # step pass on the rerun. A dropped module or an uncovered lockfile is left to fail here,
      # because both need an edit to osvOverrides that no workflow can make.
      #
      # go run ./magefiles/core rather than mage: same targets, but it builds from vendor/ and
      # needs no mage binary on the runner. See docs/AGENTS.md.
      - name: Check vendored osv-scanner overrides
        run: go run ./magefiles/core dev:verifyVendor
