# A deliberately small subset of what example/rke2-multi-cni-cilium/v1_36/v1.36.5-rke2r1
# declares, for exercising --hauler-store without collecting the whole release.
#
#   hauler store sync --filename hack/hauler/rke2-cilium-smoke.yaml --platform linux/amd64 --exclude-extras
#
# This is a PARTIAL haul on purpose. A build of that example against it resolves these four
# artifacts from the store and falls back to the network for the rest, logging a warning per
# miss - which is the fallback path, and worth seeing at least once. It is not a store that
# example can be built offline from; the manifests in example/rke2-multi-cni-hauler/ are.
#
# Every entry is a real one from that definition, so the references and URLs match it exactly.
---
apiVersion: content.hauler.cattle.io/v1
kind: Images
metadata:
  name: rke2-cilium-smoke-images
spec:
  images:
    # From .spec.config.imageConfig.images -- the flat list.
    - name: docker.io/rancher/mirrored-pause:3.10.2
    - name: docker.io/rancher/klipper-lb:v0.4.17
    # From .spec.config.engine.manifest.rke2-cilium.images, which Config.AllImages reaches
    # through the chart entry rather than the flat list. Worth one entry here: a build that
    # found the flat images and missed the chart's would still look like it worked.
    - name: docker.io/rancher/mirrored-cilium-certgen:v0.4.11
---
apiVersion: content.hauler.cattle.io/v1
kind: Files
metadata:
  name: rke2-cilium-smoke-files
spec:
  files:
    # The one file entry in the definition with no arch selector, and the smallest.
    - path: https://rpm.rancher.io/rke2/latest/common/centos/9/noarch/rke2-selinux-0.22-1.el9.noarch.rpm
