---
# Remove the cluster from the fleet.
#
#   ansible-playbook -i ../inventories/fleet reset.yml -e reset_confirmed=bubbles
#
# There is no package here: the distro to remove is named directly, because the thing being
# removed is what is on the nodes rather than what is in an artifact.
#
# The guard below is not ceremony. A module cannot ask for confirmation -- there is no terminal on
# the other end, and the task itself is the confirmation -- so the only thing standing between a
# mistyped inventory and a destroyed cluster is a check the playbook makes. Naming the cluster on
# the command line means the name has to be typed by whoever runs it.
- name: Remove the cluster
  hosts: localhost
  connection: local
  gather_facts: false

  # Which cluster, and nothing else. A reset has no use for the profiles or the mirror, so it does
  # not read ../cluster/config.yml and does not need the mirror credentials that file templates.
  # Splitting the block into separate variables is what makes taking half of it possible.
  vars_files:
    - ../cluster/identity.yml

  vars:
    reset_confirmed: ""

  tasks:
    - name: Check that the cluster to remove was named
      ansible.builtin.assert:
        that:
          - reset_confirmed == cargoship_cluster_name
        fail_msg: >-
          This removes the {{ cargoship_cluster_name }} cluster from every host in the inventory.
          Re-run with -e reset_confirmed={{ cargoship_cluster_name }} if that is what you meant.

    - name: Reset the fleet
      ansible.builtin.include_role:
        name: colonel_byte.cargoship.cluster
      vars:
        cargoship_action: reset
        cargoship_args:
          # Naming the distro is not optional in practice. Left unset, cargoship picks one, and a
          # reset scoped to the wrong engine removes less than it reports.
          distro: rke2
        cargoship_show_result: true
