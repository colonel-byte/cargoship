# The smallest inventory cargoship can install from.
#
# Group membership is the whole of the role assignment: the hosts in `controller` become the
# control plane, the hosts in `worker` become the rest. Host order decides which node bootstraps
# the cluster, so kc01 is the leader here.
#
# Nothing in this file is connected to by Ansible. Cargoship reads it, translates it, and opens
# every SSH connection itself from the management node the play runs on.

[controller]
kc01 ansible_host=10.1.2.3
kc02 ansible_host=10.1.2.4
kc03 ansible_host=10.1.2.5

[worker]
kw01 ansible_host=10.1.2.10
kw02 ansible_host=10.1.2.11

[all:vars]
ansible_user=root
ansible_ssh_private_key_file=/srv/staging/keys/fleet_ed25519
