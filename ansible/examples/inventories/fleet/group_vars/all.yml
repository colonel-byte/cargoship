---
# Connection details come from the Ansible variables you already set. Cargoship reads four of
# them -- ansible_host, ansible_user, ansible_port, ansible_ssh_private_key_file -- and ignores
# every other ansible_ variable, because they belong to Ansible's own connection plugins and
# cargoship does not connect the way Ansible does.
ansible_user: root
ansible_port: 22
ansible_ssh_private_key_file: /srv/staging/keys/fleet_ed25519
