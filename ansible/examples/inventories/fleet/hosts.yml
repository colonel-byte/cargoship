---
# The same fleet as fleet.ini, written as a directory so that group_vars and host_vars have
# somewhere to live. Ansible resolves all of it -- group membership, variable precedence, the
# lot -- and hands cargoship the merged result. Nothing here is parsed by cargoship itself.
#
# Host order is load-bearing. Controllers are written to the generated inventory first, and the
# first controller bootstraps the cluster, so kc01 is the leader.
all:
  children:
    controller:
      hosts:
        kc01:
          ansible_host: 10.1.2.3
        kc02:
          ansible_host: 10.1.2.4
        kc03:
          ansible_host: 10.1.2.5
    worker:
      hosts:
        kw01:
          ansible_host: 10.1.2.10
        kw02:
          ansible_host: 10.1.2.11
        kw03:
          ansible_host: 10.1.2.12
