---
- name: Check that the requested action has a module
  ansible.builtin.assert:
    that:
      - cargoship_action in _cargoship_actions
    fail_msg: >-
      cargoship_action is "{{ cargoship_action }}", which is not a cargoship module.
      The actions are: {{ _cargoship_actions | join(', ') }}.
  run_once: true
  delegate_to: "{{ cargoship_delegate_to }}"

- name: Check that a package was named
  ansible.builtin.assert:
    that:
      - cargoship_package | length > 0
    fail_msg: cargoship_package is required by the {{ cargoship_action }} action.
  when: cargoship_action in _cargoship_package_actions
  run_once: true
  delegate_to: "{{ cargoship_delegate_to }}"

# cargoship_args is merged last, so a key the role sets itself would be overridden by it without
# anything being said. A module rejects the same parameter given twice by name, and this holds
# cargoship_args to that rule rather than letting the role be the one place a collision is silent.
# cargoship_cluster is one dict, and Ansible replaces a dict between precedence levels rather than
# merging it, so the whole block has to be written at one level. The five cargoship_cluster_*
# variables are separate, so each can be set wherever it belongs -- the registries fleet-wide, the
# values per environment, the name in the play. A sibling that was set wins over the same key
# inside the block; one left at its default changes nothing.
- name: Combine cargoship_cluster with the variables that set its keys one at a time
  ansible.builtin.set_fact:
    _cargoship_cluster: >-
      {{
        cargoship_cluster
        | combine({'name': cargoship_cluster_name} if cargoship_cluster_name else {})
        | combine({'loadbalancer': cargoship_cluster_loadbalancer} if cargoship_cluster_loadbalancer else {})
        | combine({'profiles': cargoship_cluster_profiles} if cargoship_cluster_profiles else {})
        | combine({'registries': cargoship_cluster_registries} if cargoship_cluster_registries else {})
        | combine({'values': cargoship_cluster_values} if cargoship_cluster_values else {})
      }}
  run_once: true

# The two required keys are checked here rather than in the argument spec, because either may
# arrive from cargoship_cluster or from its sibling and the spec can only see one of the two.
# Translation refuses a document missing either, so this is the same refusal moved earlier, where
# it can name both ways of supplying it.
- name: Check that the cluster was named and given a load balancer
  ansible.builtin.assert:
    that:
      - _cargoship_cluster.name | default('', true) | length > 0
      - _cargoship_cluster.loadbalancer | default('', true) | length > 0
    fail_msg: >-
      The cluster needs a name and a loadbalancer. Set them inside cargoship_cluster, or as
      cargoship_cluster_name and cargoship_cluster_loadbalancer. Got name
      "{{ _cargoship_cluster.name | default('') }}" and loadbalancer
      "{{ _cargoship_cluster.loadbalancer | default('') }}".
  run_once: true
  delegate_to: "{{ cargoship_delegate_to }}"

- name: Check that cargoship_args claims no parameter the role sets itself
  ansible.builtin.assert:
    that:
      - cargoship_args.keys() | list | intersect(_cargoship_reserved_args) | length == 0
    fail_msg: >-
      cargoship_args sets
      {{ cargoship_args.keys() | list | intersect(_cargoship_reserved_args) | sort | join(', ') }},
      which the role assembles from its own variables. Set the matching role variable instead --
      cargoship_package, cargoship_inventory_path, cargoship_log_file, cargoship_age_recipients,
      or cargoship_age_identity_files.
  run_once: true
  delegate_to: "{{ cargoship_delegate_to }}"

# groups and hostvars are deliberately absent. The action plugin fills them in from the play's own
# task variables, which is the whole reason it exists.
#
# The two are kept apart because a task whose whole argument dict is one template is unsafe, and
# Ansible warns about it every run. Passing them as two parameters keeps the keys of the task
# literal; the action plugin merges the second one into the arguments before the module sees it.
- name: Assemble the cargoship module arguments
  ansible.builtin.set_fact:
    _cargoship_inventory: >-
      {{
        {'cluster': _cargoship_cluster}
        | combine({'roleGroups': cargoship_role_groups} if cargoship_role_groups else {})
      }}
    _cargoship_parameters: >-
      {{
        {}
        | combine({'inventory_path': cargoship_inventory_path} if cargoship_inventory_path else {})
        | combine({'package': cargoship_package} if cargoship_action in _cargoship_package_actions else {})
        | combine({'log_file': cargoship_log_file | bool} if cargoship_log_file is defined and cargoship_log_file is not none else {})
        | combine({'age_recipient': ([cargoship_age_recipients] if cargoship_age_recipients is string else cargoship_age_recipients)} if cargoship_age_recipients else {})
        | combine({'age_identity_file': ([cargoship_age_identity_files] if cargoship_age_identity_files is string else cargoship_age_identity_files)} if cargoship_age_identity_files and cargoship_action in _cargoship_identity_actions else {})
        | combine(cargoship_args)
      }}
  run_once: true

- name: Run cargoship {{ cargoship_action }}
  ansible.builtin.include_tasks: "{{ cargoship_action }}.yml"
