---
# The cargoship action to run: apply, prepare, engine_config_sync, reset, or kube_config.
cargoship_action: apply

# The distro package to install, stage, or synchronise from. Required by every action except
# reset and kube_config, which install nothing.
cargoship_package: ""

# The settings that belong to the cluster rather than to any host. name and loadbalancer are
# required; profiles, registries, and values are optional and take the shape the inventory schema
# documents. See docs/guides/setup-inv.md.
cargoship_cluster: {}

# The mapping from a cargoship role onto the Ansible groups that carry it, for an inventory that
# does not name its groups controller and worker. Left empty, the default mapping applies.
cargoship_role_groups: {}

# Where to write the generated Cluster document. A private temporary file when empty, removed
# after a run that succeeded.
cargoship_inventory_path: ""

# Age public keys used to encrypt registry credentials written to disk in the generated inventory document.
cargoship_age_recipients: []

# Path(s) to age identity files (or SSH private keys) used to decrypt registry credentials at apply
# time. Only apply and engine_config_sync read an encrypted value, so only those two are given the
# identities; the other three actions accept no such parameter and are not passed one. Setting this
# fleet-wide, in group_vars, is therefore safe whichever action a play runs.
cargoship_age_identity_files: []

# Whether to always write a full-verbosity debug log to a file, regardless of log level. Left
# unset, the module renders no flag and whatever cargoship-config.yaml says still applies -- which
# is why the default is null rather than false. A literal false here is a decision, and it
# overrules a config file that asked for the log.
cargoship_log_file: null

# Everything else the chosen module takes, passed through verbatim. See docs/ansible/cargoship/modules.md for
# the parameters of each module. A parameter the role assembles from a variable of its own --
# package, inventory_path, log_file, age_recipient, age_identity_file -- is refused here rather
# than silently overriding it; set the matching cargoship_ variable instead.
cargoship_args: {}

# The node cargoship runs on. It is the management node: the one the package and images were
# staged onto, which reaches the fleet over SSH. Set this to the inventory name of that node when
# it is not the Ansible controller.
cargoship_delegate_to: localhost

# Whether to suppress task parameter and result logging. Defaults to true to avoid exposing
# decrypted credentials and fleet inventories in logs. Set to false when debugging locally.
cargoship_no_log: true

# Whether to print cargoship's own report on the run. The task itself defaults to no_log: true, because
# a module's arguments name the fleet; the report holds file paths and phase names and no key
# material.
cargoship_show_result: false
