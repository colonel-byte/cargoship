---
# The role's documented interface.
argument_specs:
  main:
    short_description: Inspect a Zarf package definition and expose structured metadata facts
    description:
      - "Runs C(zarf package inspect definition) against a package source and parses the YAML definition."
      - "A C(zarf_public_key) with no C(zarf_verify) requires a signature, which is stricter than the module's own default. See C(zarf_verify)."
      - "Sets the C(zarf_package_definition), C(zarf_package_name), C(zarf_package_version), and C(zarf_package_flavor) facts."
      - "Every task carries C(run_once: true) and delegates to C(zarf_delegate_to)."
    version_added: "0.31.0"
    options:
      zarf_package:
        type: str
        default: ""
        description:
          - "The package source to inspect: a path to a staged tarball, an C(oci://) reference, or a deployed package name."
      zarf_public_key:
        type: str
        default: ""
        description:
          - "Path to the public key a package signature is verified against."
      zarf_verify:
        type: str
        default: ""
        choices:
          - ""
          - never
          - if-possible
          - always
        description:
          - "When to verify the package signature."
          - "Left empty, the role requires a signature when C(zarf_public_key) names a key, and leaves zarf's own C(if-possible) default alone when it does not. Set it explicitly to override."
      zarf_kubeconfig:
        type: str
        default: ""
        description:
          - "Path to the kubeconfig file, used when inspecting a deployed cluster package."
      zarf_binary:
        type: str
        default: zarf
        description:
          - "Path to the C(zarf) binary on the delegated host."
      zarf_delegate_to:
        type: str
        default: localhost
        description:
          - "The node on which to execute the inspection."
