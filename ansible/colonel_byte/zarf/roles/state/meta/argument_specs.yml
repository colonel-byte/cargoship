---
# The role's documented interface.
argument_specs:
  main:
    short_description: Fetch and parse the Zarf state secret from a cluster into an Ansible fact
    description:
      - "Queries the cluster for the C(zarf-state) Secret via C(zarf tools kubectl) and sets the parsed state as the C(zarf_state) fact."
      - "The credentials the Secret holds are withheld unless C(zarf_include_credentials) is set. The paths that were withheld are set as the C(zarf_state_redacted) fact."
      - "Every task carries C(run_once: true), C(no_log) from C(zarf_no_log), and delegates to C(zarf_delegate_to)."
    version_added: "0.31.0"
    options:
      zarf_kubeconfig:
        type: str
        default: ""
        description:
          - "Path to the kubeconfig file used to reach the cluster. Left empty, uses default kubeconfig."
      zarf_delegate_to:
        type: str
        default: localhost
        description:
          - "The node on which to execute the zarf state query."
      zarf_binary:
        type: str
        default: zarf
        description:
          - "Path to the C(zarf) binary on the delegated host."
      zarf_namespace:
        type: str
        default: zarf
        description:
          - "The namespace holding the C(zarf-state) Secret."
      zarf_include_credentials:
        type: bool
        default: false
        description:
          - "Whether to return the credentials the C(zarf-state) Secret holds: the registry push, pull and seed secrets, the git server passwords, the artifact server token, and the agent's TLS private key."
          - "Left false, they are removed from C(zarf_state) and named in C(zarf_state_redacted)."
      zarf_no_log:
        type: bool
        default: true
        description:
          - "Whether to suppress task parameter and result logging. Applied to the C(set_fact) task as well as to the module call, because C(set_fact) prints the fact it sets."
          - "Set it to false when debugging locally."
