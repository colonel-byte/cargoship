---
# yaml-language-server: $schema=schema/config-distro-schema.json
log_level: info
log_format: console
tmp_dir: /tmp
zarf_cache: ~/.cache/cargoship
timeout: 60m
distro:
  type: rke2
  oci_concurrency: 10
  concurrency: 300
  worker_concurrency: 5
  hosts: true
  firewall: true
  fapolicyd: true
  output: ~/zarf
  # Uncomment to record every run. {command} and {timestamp} expand per run, so each
  # receipt lands in its own file; a leading ~ is expanded the way a shell would.
  # receipt_path: ~/.cache/cargoship/logs/{command}-{timestamp}.json
