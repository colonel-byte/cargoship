# testdata/minimal-image with one declared file, so a build exercises the file half of
# --content-store as well as the image half.
#
# The file half needs a definition that declares both a remote source and a shasum, because
# those are the two things the store path depends on: the source is the key a content store is
# searched by, and a file with no shasum is refused from a store rather than staged unverified.
# testdata/minimal-image declares no files at all, which is why this is a second definition
# rather than a flag on that one.
#
# __PAYLOAD_SHA256__ is rewritten to the sha256 of testdata/minimal-image-file/payload.sh, which
# is what the test puts into the store under the URL below. It is substituted rather than written
# out because payload.sh is rewritten by the addlicense and end-of-file hooks, so a checksum
# committed here would go stale the next time one of them touched the file.
#
# __REGISTRY__ is rewritten to the address of the in-memory registry the test starts, and that
# registry is the only host contacted. The file's source URL is never fetched: the whole point
# of the test is that the store answers for it first.
#
# Nothing here is contacted. The tests only read this file and rewrite copies of it.

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/colonel-byte/cargoship/refs/heads/main/schema/distro-v1alpha1-schema.json
apiVersion: colonel-byte.dev/v1alpha1
kind: Distro
metadata:
  name: e2e-minimal-image-file
  version: 0.0.1
  architecture: amd64
spec:
  type: rke2
  version: 1.35.0-rke2r1
  config:
    files:
      - name: payload
        source: https://example.invalid/cargoship/payload.sh
        target: /usr/local/bin/cargoship-payload.sh
        shasum: __PAYLOAD_SHA256__
        perm: "0755"
    imageConfig:
      images:
        - __REGISTRY__/pause:3.10
    engine:
      config:
        cluster-cidr: 10.42.0.0/16
        cluster-domain: cluster.local
