# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go generate ./...
    # The Ansible collection is a release artifact of its own: the management node that runs the
    # playbooks is inside the airlock, so it installs the collection from this tarball rather than
    # from Galaxy. A snapshot passes no version, because its version is not the one in galaxy.yml.
    - hack/ansible-build-collection.sh bin/ansible {{ if .IsSnapshot }}{{ else }}{{ .Version }}{{ end }}

builds:
  - id: cargoship
    main: ./.
    binary: cargoship
    ldflags:
      - -s
      - -w
      - -X github.com/colonel-byte/cargoship/src/config.CLIVersion={{ .Version }}
      - -X github.com/colonel-byte/cargoship/src/config.CLICommit={{ .ShortCommit }}
    gcflags:
      - all=-l -B -C
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - arm64
      - amd64
      - riscv64
    goamd64:
      - v1
    goarm:
      - "6"
      - "7"
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

nfpms:
  - id: packagers
    package_name: cargoship
    license: Apache 2.0
    maintainer: |-
      Allen Conlon <software@conlon.dev>
    formats:
      - apk
      - deb
      - rpm
    goamd64:
      - v1
    mtime: "{{ .CommitDate }}"
    contents:
      # The Ansible collection. /usr/share/ansible/collections is on ansible-core's default
      # collections path, so installing the package is all a management node needs.
      - src: ansible/colonel_byte/cargoship
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/cargoship
        type: tree
        # Explicit, and not a tidiness preference. nfpm's apk writer emits a `tree`
        # entry's root directory with the Go fs.FileMode it stat'd, fs.ModeDir bit
        # and all (apk/apk.go, `Mode: int64(file.FileInfo.Mode)`, still unmasked as
        # of nfpm v2.47.0 -- the deb writer goes through tarHeader and is unaffected).
        # 0o20000000755 does not fit a tar header's octal mode field, so Go falls
        # back to base-256 encoding and apk-tools rejects the package outright:
        # `ERROR: cargoship-<version>: v2 package format error`, on apk-tools 2 and 3
        # alike. Setting the mode here keeps it inside the octal field.
        #
        # It applies to the whole tree, so the collection's YAML ships 0755 rather
        # than 0644. That is cosmetic -- Ansible reads them either way -- and it is
        # the only lever nfpm offers: a separate `type: dir` entry for the same
        # destination is refused as a content collision. Drop this when nfpm masks
        # the mode with .Perm(), and check `apk add` still works when you do.
        file_info:
          mode: 0755
      # The module files. There is no Python module behind any of them: the binary answers
      # Ansible when it is invoked under a cargoship_ name. See
      # docs/agent/choice-ansible-module.md.
      - src: /usr/bin/cargoship
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/cargoship/plugins/modules/cargoship_apply
        type: symlink
      - src: /usr/bin/cargoship
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/cargoship/plugins/modules/cargoship_engine_config_sync
        type: symlink
      - src: /usr/bin/cargoship
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/cargoship/plugins/modules/cargoship_kube_config
        type: symlink
      - src: /usr/bin/cargoship
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/cargoship/plugins/modules/cargoship_prepare
        type: symlink
      - src: /usr/bin/cargoship
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/cargoship/plugins/modules/cargoship_reset
        type: symlink
    rpm:
      compression: gzip
      prefixes:
        - /usr/bin
      signature:
        # The OpenPGP key, shared with deb below. apk needs a different key entirely --
        # see the note on apk.signature. NFPM_PASSPHRASE unlocks it when it is protected.
        key_file: '{{ if ne (index .Env "GPG_KEY_PATH") "" }}{{ .Env.GPG_KEY_PATH }}{{ else }}{{ end }}'
    deb:
      compression: zstd
      signature:
        key_file: '{{ if ne (index .Env "GPG_KEY_PATH") "" }}{{ .Env.GPG_KEY_PATH }}{{ else }}{{ end }}'
    apk:
      signature:
        # A different key from rpm and deb, and not an oversight. nfpm signs rpm and deb
        # with OpenPGP, but apk with a bare RSA key: apk/apk.go hands the digest to
        # internal/sign.RSASignSHA1Digest, which parses the file as a PEM RSA private
        # key. Pointing this at the GPG key fails the build outright, with
        # `signing error: no PEM block found`.
        #
        # The key must also be unencrypted. nfpm's rsa.go only understands the legacy
        # DEK-Info PEM encryption, so the PKCS#8 output of `openssl genrsa -aes256` is
        # rejected -- `key type "ENCRYPTED PRIVATE KEY" is not supported` -- and
        # NFPM_APK_PASSPHRASE cannot help. It is protected as a CI secret instead.
        #
        # key_name is left at its default, the maintainer address parsed from the
        # `maintainer` field above. It is baked into the package as the signature member
        # `.SIGN.RSA.<key_name>.rsa.pub`, and a consumer must install the public key at
        # /etc/apk/keys/<key_name>.rsa.pub -- so changing it later breaks the path every
        # existing consumer already deployed. See docs/dev/goreleaser.md.
        key_file: '{{ if ne (index .Env "APK_RSA_KEY_PATH") "" }}{{ .Env.APK_RSA_KEY_PATH }}{{ else }}{{ end }}'

dockers_v2:
  - id: cargoship
    ids:
      - cargoship
    dockerfile: containers/base/Dockerfile
    images:
      - "ghcr.io/colonel-byte/cargoship"
    tags:
      - "{{ .Tag }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--pull"
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"

  - id: cargoship-ubi
    # Pulls in the nfpms artifacts instead of the raw binary: containers/ubi/Dockerfile
    # installs the .rpm so the package is registered in the image's rpmdb.
    ids:
      - packagers
    dockerfile: containers/ubi/Dockerfile
    images:
      - "ghcr.io/colonel-byte/cargoship-ubi"
    tags:
      - "{{ .Tag }}"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--pull"
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
    extra_files:
      - crypto/software@conlon.dev.gpg

  - id: cargoship-deb
    # Pulls in the nfpms artifacts instead of the raw binary: containers/deb/Dockerfile
    # dpkg-installs the .deb so the package is registered in the image's dpkg database.
    # It is also the only thing in the pipeline that installs the .deb at all.
    ids:
      - packagers
    dockerfile: containers/deb/Dockerfile
    images:
      - "ghcr.io/colonel-byte/cargoship-deb"
    tags:
      - "{{ .Tag }}"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--pull"
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
    # extra_files:
    #   - crypto/software@conlon.dev.gpg

  - id: cargoship-ansible
    # Pulls in the nfpms artifacts instead of the raw binary: containers/ansible/Dockerfile
    # installs the .apk, which is what carries the collection tree and the module symlinks.
    ids:
      - packagers
    dockerfile: containers/ansible/Dockerfile
    images:
      - "ghcr.io/colonel-byte/cargoship-ansible"
    tags:
      - "{{ .Tag }}"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--pull"
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
    extra_files:
      - crypto/software@conlon.dev.rsa.pub

changelog:
  sort: asc

signs:
  - id: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    stdin: "{{ .Env.COSIGN_PASSWORD }}"
  - id: archive
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: archive
    stdin: "{{ .Env.COSIGN_PASSWORD }}"

docker_signs:
  - id: images
    cmd: cosign
    args:
      - "sign"
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "${artifact}@${digest}"
      - "--yes"
    stdin: "{{ .Env.COSIGN_PASSWORD }}"

release:
  github:
    owner: colonel-byte
    name: cargoship
  name_template: "v{{ .Version }}"
  mode: append
  # The collection tarball and its signature are built by the before hook above rather than by a
  # build, so they reach the release this way. They carry their own cosign bundle because the
  # checksums file covers artifacts the pipeline built itself.
  extra_files:
    - glob: bin/ansible/colonel_byte-cargoship-*.tar.gz
    - glob: bin/ansible/colonel_byte-cargoship-*.tar.gz.sigstore.json
  footer: |-
    ---
    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
