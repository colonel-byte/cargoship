# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # The Ansible collection is a release artifact of its own: the management node that runs the
    # playbooks is inside the airlock, so it installs the collection from this tarball rather than
    # from Galaxy. A snapshot passes no version, because its version is not the one in galaxy.yml.
    - hack/ansible-build-collection.sh bin/ansible {{ if .IsSnapshot }}""{{ else }}{{ .Version }}{{ end }} ansible/colonel_byte/cargoship

builds:
  - id: cargoship
    main: ./cmd/cargoship
    binary: cargoship
    ldflags:
      - -s
      - -w
      - -X github.com/colonel-byte/cargoship/config.CLIVersion={{ .Version }}
      - -X github.com/colonel-byte/cargoship/config.CLICommit={{ .ShortCommit }}
    # Keep in step with pkg/utils/build.GCFLags(); -B and -C were removed
    # deliberately -- see docs/dev/build-flags.md.
    gcflags:
      - all=-l
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - arm64
      - amd64
      - riscv64
    goamd64:
      - v1
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Pinned to the cargoship binary. Without ids, every build lands in this archive, and
  # cargoship_Linux_x86_64.tar.gz would quietly gain a second binary.
  - id: cargoship
    ids:
      - cargoship
    formats:
      - tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

nfpms:
  - id: packagers
    package_name: cargoship
    # Listed explicitly so that adding a second build does not silently add a second binary to
    # this package.
    ids:
      - cargoship
    license: Apache 2.0
    maintainer: |-
      Allen Conlon <software@conlon.dev>
    formats:
      - apk
      - deb
      - rpm
    goamd64:
      - v1
    mtime: "{{ .CommitDate }}"
    contents:
      # Shell completion
      - src: hack/completion/{{ .ProjectName }}.bash
        dst: /etc/bash_completion.d/{{ .ProjectName }}
        file_info:
          mode: 0644
      - src: hack/completion/{{ .ProjectName }}.fish
        dst: /usr/share/fish/vendor_completions.d/{{ .ProjectName }}.fish
        file_info:
          mode: 0644
      - src: hack/completion/{{ .ProjectName }}.zsh
        dst: /usr/local/share/zsh/site-functions/_{{ .ProjectName }}
        file_info:
          mode: 0644
    rpm:
      compression: gzip
      prefixes:
        - /usr/bin
      signature:
        key_file: '{{ if ne (index .Env "GPG_KEY_PATH") "" }}{{ .Env.GPG_KEY_PATH }}{{ else }}{{ end }}'
    deb:
      compression: zstd
      signature:
        key_file: '{{ if ne (index .Env "GPG_KEY_PATH") "" }}{{ .Env.GPG_KEY_PATH }}{{ else }}{{ end }}'
    apk:
      signature:
        key_file: '{{ if ne (index .Env "APK_RSA_KEY_PATH") "" }}{{ .Env.APK_RSA_KEY_PATH }}{{ else }}{{ end }}'

  # The Ansible collection, packaged apart from the binary. A management node that drives the
  # fleet through playbooks wants both; a node that only runs the CLI wants neither the tree nor
  # an ansible-core to go with it. Named for the distro convention -- Fedora's packaging
  # guidelines spell a collection ansible-collection-<namespace>-<name>.
  - id: ansible-collection
    package_name: ansible-collection-colonel-byte-cargoship
    # meta, because the package carries no binary of its own: the module files below are symlinks
    # to the one the cargoship package installs. The ids are still needed, since they are what
    # tells goreleaser which platforms to build the package for.
    #
    # meta is also what makes the package noarch, which is correct for a tree of YAML and
    # symlinks but puts it out of reach of the image builds: GoReleaser hardcodes a meta nfpm to
    # goos linux and goarch all, and the dockers_v2 pipe selects an image's context artifacts
    # with ByGoos and ByGoarch, so goarch "all" matches no requested platform. The pipe does
    # have an escape hatch for arch-independent artifacts, but it keys on goos rather than
    # goarch, and extra_files cannot stand in because it takes literal paths -- no globs and no
    # templating -- and the filename carries the version. So no image installs this package;
    # .github/workflows/test-build-containers.yaml installs it in a throwaway container instead.
    meta: true
    ids:
      - cargoship
    license: Apache 2.0
    maintainer: |-
      Allen Conlon <software@conlon.dev>
    formats:
      - apk
      - deb
      - rpm
    goamd64:
      - v1
    mtime: "{{ .CommitDate }}"
    contents:
      # /usr/share/ansible/collections is on ansible-core's default collections path, so
      # installing the package is all a management node needs.
      - src: ansible/colonel_byte/cargoship
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/cargoship
        type: tree
        # Explicit, and not a tidiness preference.
        file_info:
          mode: 0755
      # The module files. There is no Python module behind any of them: the binary answers
      # Ansible when it is invoked under a cargoship_ name. See
      # docs/agent/choice-ansible-module.md.
      - src: /usr/bin/cargoship
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/cargoship/plugins/modules/cargoship_apply
        type: symlink
      - src: /usr/bin/cargoship
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/cargoship/plugins/modules/cargoship_engine_config_sync
        type: symlink
      - src: /usr/bin/cargoship
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/cargoship/plugins/modules/cargoship_kube_config
        type: symlink
      - src: /usr/bin/cargoship
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/cargoship/plugins/modules/cargoship_prepare
        type: symlink
      - src: /usr/bin/cargoship
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/cargoship/plugins/modules/cargoship_reset
        type: symlink
    # Every module file here is a symlink to /usr/bin/cargoship, and ansible-core is what reads
    # the collection at all, so both are hard requirements rather than recommendations. 2.15 is
    # the floor the collection's meta/runtime.yml already declares.
    #
    # The cargoship dependency is deliberately unversioned, which is weaker than it should be:
    # the binary and the action plugins are one interface released together, so a version pin
    # belongs here. GoReleaser does not run its template engine over nfpms dependencies -- a
    # {{ .Version }} reaches the package metadata as that literal string -- and the alternatives
    # are a hand-maintained nfpm.yaml or a generated config, neither of which is worth it for a
    # pair of packages that only ever ship together.
    #
    # A whole override block replaces the base field it names, so each lists both dependencies
    # rather than adding to a shared one. The spelling of a version constraint is per-format.
    overrides:
      rpm:
        dependencies:
          - cargoship
          - ansible-core >= 2.15.0
      deb:
        dependencies:
          - cargoship
          - ansible-core (>= 2.15.0)
      apk:
        dependencies:
          - cargoship
          - ansible-core>=2.15.0
    rpm:
      compression: gzip
      signature:
        key_file: '{{ if ne (index .Env "GPG_KEY_PATH") "" }}{{ .Env.GPG_KEY_PATH }}{{ else }}{{ end }}'
    deb:
      compression: zstd
      signature:
        key_file: '{{ if ne (index .Env "GPG_KEY_PATH") "" }}{{ .Env.GPG_KEY_PATH }}{{ else }}{{ end }}'
    apk:
      signature:
        key_file: '{{ if ne (index .Env "APK_RSA_KEY_PATH") "" }}{{ .Env.APK_RSA_KEY_PATH }}{{ else }}{{ end }}'

dockers_v2:
  - id: cargoship
    ids:
      - cargoship
    dockerfile: containers/base/Dockerfile
    images:
      - "ghcr.io/colonel-byte/cargoship"
    tags:
      - "{{ .Tag }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--pull"
    labels:
      <<: &labels
        "org.opencontainers.image.description": |-
          Airgapped Kubernetes distribution packaging and deployment
        "org.opencontainers.image.version": |-
          {{ .Version }}
        "org.opencontainers.image.revision": |-
          {{ .FullCommit }}
        "org.opencontainers.image.created": |-
          {{ .CommitDate }}
        "org.opencontainers.image.base.name": |-
          {{ .BaseImage }}
        "org.opencontainers.image.base.digest": |-
          {{ .BaseImageDigest }}
        "index,manifest:org.opencontainers.image.source": |-
          https://github.com/colonel-byte/cargoship
        "index,manifest:org.opencontainers.image.title": |-
          cargoship
        "index,manifest:org.opencontainers.image.licenses": |-
          Apache-2.0
        "index,manifest:org.opencontainers.image.description": |-
          Airgapped Kubernetes distribution packaging and deployment
  - id: cargoship-ubi
    ids:
      - packagers
    dockerfile: containers/ubi/Dockerfile
    images:
      - "ghcr.io/colonel-byte/cargoship-ubi"
    tags:
      - "{{ .Tag }}"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--pull"
    build_args:
      BASH_COMPLETION_VERSION: 2.11-16.el10
    labels:
      <<: *labels
    extra_files:
      - crypto/software@conlon.dev.gpg

  - id: cargoship-deb
    # Pulls in the nfpms artifacts instead of the raw binary: containers/deb/Dockerfile
    # dpkg-installs the .deb so the package is registered in the image's dpkg database.
    # It is also the only thing in the pipeline that installs the .deb at all.
    #
    # Only the binary package: the collection package is noarch, and the dockers_v2 pipe
    # selects context artifacts by goos and goarch, so a goarch of "all" matches no requested
    # platform and never reaches the build context. See the comment on ansible-collection.
    ids:
      - packagers
    dockerfile: containers/deb/Dockerfile
    images:
      - "ghcr.io/colonel-byte/cargoship-deb"
    tags:
      - "{{ .Tag }}"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--pull"
    labels:
      <<: *labels
    extra_files:
      - crypto/software@conlon.dev.gpg

  - id: cargoship-ansible
    # The binary package only, for the reason on cargoship-deb. This image therefore installs
    # the collection the way a management node without the package does -- ansible-galaxy from
    # a locally built tarball -- rather than from ansible-collection-colonel-byte-cargoship.
    # That package is installed and checked by test-build-containers.yaml instead.
    ids:
      - packagers
    dockerfile: containers/ansible/Dockerfile
    images:
      - "ghcr.io/colonel-byte/cargoship-ansible"
    tags:
      - "{{ .Tag }}"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--pull"
    build_args:
      ANSIBLE_CORE_VERSION: 2.16.16-2.el10_2.1
      BASH_COMPLETION_VERSION: 2.11-16.el10
    labels:
      "org.opencontainers.image.description": |-
        Airgapped Kubernetes distribution packaging and deployment, with the Ansible collection
      "index,manifest:org.opencontainers.image.description": |-
        Airgapped Kubernetes distribution packaging and deployment, with the Ansible collection
      <<: *labels
    extra_files:
      - crypto/software@conlon.dev.gpg
      - ansible/colonel_byte/cargoship
      - hack/ansible-link-modules.sh

changelog:
  sort: asc

docker_digest:
  name_template: "digest.txt"

signs:
  - id: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    stdin: "{{ .Env.COSIGN_PASSWORD }}"
  - id: archive
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: archive
    stdin: "{{ .Env.COSIGN_PASSWORD }}"

docker_signs:
  - id: images
    cmd: cosign
    args:
      - "sign"
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "${artifact}@${digest}"
      - "--yes"
    stdin: "{{ .Env.COSIGN_PASSWORD }}"

release:
  github:
    owner: colonel-byte
    name: cargoship
  name_template: "v{{ .Version }}"
  mode: append
  # The collection tarball and its signature are built by the before hook above rather than by a
  # build, so they reach the release this way. They carry their own cosign bundle because the
  # checksums file covers artifacts the pipeline built itself.
  extra_files:
    - glob: bin/ansible/colonel_byte-cargoship-*.tar.gz
    - glob: bin/ansible/colonel_byte-cargoship-*.tar.gz.sigstore.json
  footer: |-
    ---

    ### Verify release artifacts with Cosign

    Release archives and container images are signed with [Cosign](https://docs.sigstore.dev/cosign/).

    Find the public key at [`cosign.pub`](https://raw.githubusercontent.com/colonel-byte/cargoship/refs/tags/{{ .Tag }}/cosign.pub)

    Verify a binary archive:

    ```console
    cosign verify-blob --key cosign.pub --bundle cargoship_Linux_x86_64.tar.gz.sigstore.json cargoship_Linux_x86_64.tar.gz
    ```

    Verify a image tag:
    ```console
    cosign verify --key cosign.pub ghcr.io/colonel-byte/cargoship:{{ .Tag }}
    ```
