# A kubeconfig that points at its credentials on disk rather than embedding them, which is the shape
# an administrator writes by hand and the shape kubeadm leaves behind. Reading credentials out of it
# means following each of these paths to a second file.
#
# Nothing here is contacted, and the paths are read from a fake filesystem the test sets up.
apiVersion: v1
kind: Config
clusters:
- name: kubernetes
  cluster:
    server: https://127.0.0.1:6443
    certificate-authority: /etc/kubernetes/pki/ca.crt
users:
- name: admin
  user:
    client-certificate: /etc/kubernetes/pki/admin.crt
    client-key: /etc/kubernetes/pki/admin.key
contexts:
- name: admin@kubernetes
  context:
    cluster: kubernetes
    user: admin
current-context: admin@kubernetes
