---
# yaml-language-server: $schema=../../../../../schema/zarf-v1alpha1-cluster-schema.json
# A registry whose account and trust bundle arrive through one merge key naming a list of mappings,
# the other form a merge key takes. Nothing else in the document names these blocks, so a walk that
# does not follow the list reaches no credential here at all and reports the file as having had
# nothing to do.
#
# goccy's decoder does not read the list form, so this is a file an operator writes and an apply then
# rejects. What is in it is still a credential, and the vault commands still have to get it out of
# the clear rather than report the registry as empty.
#
# Nothing here is contacted. The tests only read this file and rewrite copies of it.
apiVersion: zarf.dev/v1alpha1
kind: ZarfCluster
metadata:
  name: list-merge
spec:
  config:
    loadbalancer: lb.example.com
    registries:
      - name: list.test.local
        <<:
          - auth:
              user: list-user
              pass: list-pass
          - tls:
              ca: list-ca
  hosts:
    - hostname: node1
      role: controller
