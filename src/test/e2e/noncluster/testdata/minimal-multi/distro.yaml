# The minimal definition, targeting two architectures instead of one. It carries no images and
# no files for the same reason testdata/minimal does not: the publish and pull tests only need a
# package whose metadata covers more than one architecture, and downloading engine artifacts for
# two of them would cost minutes per run.

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/colonel-byte/cargoship/refs/heads/main/schema/zarf-v1alpha1-distro-package-schema.json
apiVersion: zarf.dev/v1alpha1
kind: ZarfDistro
metadata:
  name: e2e-minimal-multi
  version: 0.0.1
  architectures:
    - amd64
    - arm64
spec:
  type: rke2
  version: 1.35.0-rke2r1
  config:
    engine:
      config:
        cluster-cidr: 10.42.0.0/16
        cluster-domain: cluster.local
