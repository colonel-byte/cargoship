# The minimal definition, targeting two architectures instead of one. It carries no images for the
# same reason testdata/minimal does not: downloading engine artifacts for two architectures would
# cost minutes per run. It does carry three tiny local files -- one per architecture plus one with
# no arch selector -- so that a build of it actually exercises per-architecture file selection, and
# so the build-twice comparison has per-architecture content to compare rather than metadata alone.

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/colonel-byte/cargoship/refs/heads/main/schema/zarf-v1alpha1-distro-package-schema.json
apiVersion: zarf.dev/v1alpha1
kind: ZarfDistro
metadata:
  name: e2e-minimal-multi
  version: 0.0.1
  architectures:
    - amd64
    - arm64
spec:
  type: rke2
  version: 1.35.0-rke2r1
  config:
    engine:
      config:
        cluster-cidr: 10.42.0.0/16
        cluster-domain: cluster.local
    os:
      files:
        - source: payload/amd64.txt
          target: /var/lib/cargoship-e2e/payload.txt
          selector:
            arch:
              - amd64
        - source: payload/arm64.txt
          target: /var/lib/cargoship-e2e/payload.txt
          selector:
            arch:
              - arm64
        - source: payload/shared.txt
          target: /var/lib/cargoship-e2e/shared.txt
