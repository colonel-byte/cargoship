version: "2"
formatters:
  enable:
    - goimports
    - gofmt
  exclusions:
    paths:
      - examples$
      # Build output, not source. See the linters block below for why it is listed.
      - ^build/
linters:
  default: none
  exclusions:
    paths:
      # Build output, not source. The e2e targets point TMPDIR at build/tmp, so an
      # interrupted run leaves a go-build tree of generated cgo behind -- and the
      # linters walk the filesystem rather than the index, so build/.gitignore does
      # not keep them out. Anchored: pkg/utils/build is real source.
      - ^build/
      # The mage target files themselves are package main behind //go:build mage, which the
      # linter cannot build without mage's generated entry point. Everything under
      # magefiles/pkg/ is ordinary Go and is linted like the rest of the module.
      - magefiles/[^/]*\.go$
      - magefiles/core/
  enable:
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - nolintlint
    - revive
    - sloglint
    - staticcheck
    - testifylint
    - unused
    - whitespace
  settings:
    staticcheck:
      checks:
        - "all"
        - "-QF1008"
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*github.com/spf13/cobra.Command).Help
        - (*github.com/spf13/cobra.Command).MarkFlagRequired
        - (*github.com/spf13/pflag.FlagSet).MarkHidden
        - (*github.com/spf13/pflag.FlagSet).MarkDeprecated
        - fmt.Fprintln
        - fmt.Fprint
        - fmt.Fprintf
    govet:
      disable:
        - shadow
        - fieldalignment
        - unusedwrite
        - printf
      enable-all: true
    nolintlint:
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments:
            - "disableStutteringCheck"
        - name: if-return
        - name: increment-decrement
        - name: var-naming
          arguments:
            - [] # allowlist
            - [] # blocklist
            - [{skipPackageNameChecks: true}] # options map
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    sloglint:
      no-mixed-args: true
      key-naming-case: camel
    testifylint:
      enable-all: true
