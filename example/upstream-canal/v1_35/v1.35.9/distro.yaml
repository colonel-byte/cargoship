        - source: https://pkgs.k8s.io/core:/stable:/v1.35/deb/amd64/kubelet_1.35.9-1.1_amd64.deb
          target: /var/lib/kubernetes/deb/kubelet_1.35.9-1.1_amd64.deb
          shasum: fc2e167155114421f4ca31f222c556756a2718f73d5dff947f0065d5b7b88d1a
          selector:
            package: apt
            arch:
              - amd64
        - source: https://pkgs.k8s.io/core:/stable:/v1.35/deb/amd64/kubectl_1.35.9-1.1_amd64.deb
          target: /var/lib/kubernetes/deb/kubectl_1.35.9-1.1_amd64.deb
