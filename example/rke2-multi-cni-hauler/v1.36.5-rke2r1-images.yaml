# Every image example/rke2-multi-cni-cilium/v1_36/v1.36.5-rke2r1 declares, which is what a build
# of that example needs in the store. Collect it on a connected machine:
#
#   hauler store sync --filename example/rke2-multi-cni-hauler/v1.36.5-rke2r1-images.yaml --exclude-extras
#
# The example targets amd64 and arm64, so --platform is deliberately absent: it takes one
# platform, not a list, and omitting it collects every platform an image publishes. Passing
# --platform linux/amd64 halves the haul and gives a store a multi-architecture build cannot
# finish from.
#
# The references are spelled as the distro definition spells them. Hauler records a Docker Hub
# image under the registry's canonical host, so these come back as index.docker.io/... and
# cargoship matches either spelling; do not rewrite them to match the store.
#
# --exclude-extras leaves out the cosign signatures, attestations and SBOMs attached to these
# images. Cargoship ignores them, so the only thing carrying them costs is haul size.
apiVersion: content.hauler.cattle.io/v1
kind: Images
metadata:
  name: rke2-cilium-core
spec:
  images:
    - name: docker.io/rancher/rke2-runtime:v1.36.5-rke2r1
    - name: docker.io/rancher/hardened-kubernetes:v1.36.5-rke2r1-build20260923
    - name: docker.io/rancher/hardened-coredns:v1.14.7-build20260909
    - name: docker.io/rancher/hardened-cluster-autoscaler:v1.10.3-build20260819
    - name: docker.io/rancher/hardened-dns-node-cache:1.27.0-r1-build20260923
    - name: docker.io/rancher/hardened-etcd:v3.6.14-k3s3-build20260915
    - name: docker.io/rancher/hardened-k8s-metrics-server:v0.9.0-build20260909
    - name: docker.io/rancher/hardened-addon-resizer:1.8.23-build20260909
    - name: docker.io/rancher/klipper-helm:v0.13.3-build20260909
    - name: docker.io/rancher/klipper-lb:v0.4.17
    - name: docker.io/rancher/mirrored-pause:3.10.2
    - name: docker.io/rancher/rke2-cloud-provider:v1.36.5-0.20260915232631-dca49392c395-build20260916
    - name: docker.io/rancher/hardened-snapshot-controller:v8.6.0-build20260909
    - name: docker.io/rancher/hardened-traefik:v3.7.13-build20260910

# The images .spec.config.engine.manifest.rke2-cilium declares. They are in a document of their own
# because a definition that disables the chart still carries them -- Config.AllImages collects
# them either way, so a build needs them in the store either way.
---
apiVersion: content.hauler.cattle.io/v1
kind: Images
metadata:
  name: rke2-cilium-rke2-cilium
spec:
  images:
    - name: docker.io/rancher/mirrored-cilium-certgen:v0.4.11
    - name: docker.io/rancher/mirrored-cilium-cilium:v1.20.2
    - name: docker.io/rancher/mirrored-cilium-cilium-envoy:v1.37.6-1789133542-cbec91f666af0bf742da986d43832932dbb26b82
    - name: docker.io/rancher/mirrored-cilium-clustermesh-apiserver:v1.20.2
    - name: docker.io/rancher/mirrored-cilium-hubble-relay:v1.20.2
    - name: docker.io/rancher/mirrored-cilium-hubble-ui:v0.13.6
    - name: docker.io/rancher/mirrored-cilium-hubble-ui-backend:v0.13.6
    - name: docker.io/rancher/mirrored-cilium-operator-aws:v1.20.2
    - name: docker.io/rancher/mirrored-cilium-operator-azure:v1.20.2
    - name: docker.io/rancher/mirrored-cilium-operator-generic:v1.20.2
    - name: docker.io/rancher/hardened-cni-plugins:v1.9.1-build20260903
