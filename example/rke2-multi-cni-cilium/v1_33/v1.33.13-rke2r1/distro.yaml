# This file is generated in magefiles/templates/rke2-distro.yaml.tmpl, versions may need to updated over time.

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/colonel-byte/cargoship/refs/heads/main/schema/zarf-v1alpha1-distro-package-schema.json
apiVersion: zarf.dev/v1alpha1
kind: ZarfDistro
metadata:
  name: rancher-rke2-multi-cni-cilium
  version: 1.33.13-rke2r1
  architectures:
    - amd64
    - arm64
spec:
  type: rke2
  version: 1.33.13-rke2r1
  # The values a cluster may override in its inventory file, under spec.config.values,
  # or on the command line with --values. Every flavor exposes the bundled charts rke2
  # installs; the cilium flavors also expose the chart's own settings, so the same
  # package installs with or without encryption, hubble ui, and the rest, without being
  # rebuilt.
  values:
    files:
      - values.yaml
    schema: values.schema.json
    mappings:
      # A mapping copies the value as it stands, list included, so the charts a cluster
      # names under addons.disabled become the engine's own disable list.
      - source: .addons.disabled
        target: .config.disable
  actions:
    onCreate:
      before:
        - description: pull rke2 tar-ball
          cmd: |-
            rm -rf   target
            mkdir -p target
            echo https://github.com/rancher/rke2/releases/download/v1.33.13%2Brke2r1/rke2.linux-amd64.tar.gz
            curl -L -o ./target/rke2.linux-amd64.tar.gz https://github.com/rancher/rke2/releases/download/v1.33.13%2Brke2r1/rke2.linux-amd64.tar.gz
            echo https://github.com/rancher/rke2/releases/download/v1.33.13%2Brke2r1/rke2.linux-arm64.tar.gz
            curl -L -o ./target/rke2.linux-arm64.tar.gz https://github.com/rancher/rke2/releases/download/v1.33.13%2Brke2r1/rke2.linux-arm64.tar.gz
      after:
        - description: clean up after
          cmd: |-
            rm -rf   target
  config:
    engine:
      config:
        cluster-cidr: 10.42.0.0/16
        cluster-domain: cluster.local
        cni:
          - cilium
        disable-cloud-controller: true
        disable-kube-proxy: true
        # There is no disable list here: .addons.disabled supplies it, and this package's
        # own values.yaml carries the entry that used to be written in this file.
        embedded-registry: false
        etcd-arg:
          - "quota-backend-bytes=8589934592" # 8GB
          - "auto-compaction-retention=1h"
        kube-apiserver-arg:
          - anonymous-auth=false
          - audit-log-mode=blocking-strict
          - audit-log-maxage=30
          - authorization-mode=RBAC,Node
          - "tls-min-version=VersionTLS12"
          - "service-account-extend-token-expiration=false"
          - "tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
        kube-controller-manager-arg:
          - "tls-min-version=VersionTLS12"
          - "tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
          - bind-address=127.0.0.1
          - use-service-account-credentials=true
        kube-proxy-arg:
          - "ipvs-strict-arp=true"
        kube-scheduler-arg:
          - "tls-min-version=VersionTLS12"
          - "tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
        kubelet-arg:
          - authorization-mode=Webhook
          - anonymous-auth=false
          - streaming-connection-idle-timeout=5m
          - read-only-port=0
        profile: cis
        protect-kernel-defaults: true
        selinux: true
        service-cidr: 10.43.0.0/16
        write-kubeconfig-mode: "0600"
      audit:
        rules:
          - level: None
      podSecurity:
        plugins:
          - name: PodSecurity
            configuration:
              apiVersion: pod-security.admission.config.k8s.io/v1beta1
              kind: PodSecurityConfiguration
              defaults:
                enforce: "restricted"
                enforce-version: "latest"
                audit: "restricted"
                audit-version: "latest"
                warn: "restricted"
                warn-version: "latest"
              exemptions:
                usernames: []
                runtimeClasses: []
                namespaces:
                  - kube-system
                  - rook-ceph
                  - zarf
      manifest:
        # This flavor drives the chart from .Values rather than from mappings. The block
        # is a string, so cargoship renders it whole at install time and a value can
        # decide whether an entire subtree is written -- which one mapping per leaf
        # cannot express. The chart values themselves are unchanged. The addons list
        # above stays a mapping regardless: a package may use both mechanisms, and each
        # value is spent on whichever one says what it means.
        rke2-cilium: |-
          kubeProxyReplacement: true
          k8sServiceHost: "localhost"
          k8sServicePort: 6443
          l2announcements:
            enabled: {{ .Values.cilium.l2announcements.enabled }}
          encryption:
            enabled: {{ .Values.cilium.encryption.enabled }}
            type: wireguard
          tolerations:
            - operator: Exists
          operator:
            tolerations:
              - operator: Exists
          cni:
            exclusive: false
          bandwidthManager:
            enabled: false
          bpf:
            masquerade: true
          socketLB:
            hostNamespaceOnly: true
            enabled: true
          localRedirectPolicies:
            enabled: true
          hostFirewall:
            enabled: false
          enablePolicy: default
          {{- if .Values.cilium.hubble.ui.enabled }}
          hubble:
            enabled: true
            relay:
              enabled: true
              tolerations:
                - operator: Exists
            ui:
              enabled: true
              frontend:
                server:
                  ipv6:
                    enabled: {{ .Values.cilium.hubble.ui.ipv6 }}
              tolerations:
                - operator: Exists
          {{- else }}
          # Hubble's relay and web interface are what the observability images are for,
          # so a cluster that does not want the interface does not run either.
          hubble:
            enabled: false
          {{- end }}
    os:
      env:
        CRI_CONFIG_FILE: |-
          /var/lib/rancher/rke2/agent/etc/crictl.yaml
        KUBECONFIG: |-
          /etc/rancher/rke2/rke2.yaml
        RKE2_CONFIG_FILE: |-
          /etc/rancher/rke2/config.yaml
      sysctl:
        # Istio related sysctl overrides
        "fs.inotify.max_user_watches": 11048576
        "fs.inotify.max_user_instances": 8192
        # Misc performance
        "vm.max_map_count": 262144
        "fs.file-max": 2097152
        # Network tuning
        "net.core.somaxconn": 32768
        "net.ipv4.tcp_max_syn_backlog": 8192
        "net.core.netdev_max_backlog": 16384
        # NFTABLES
        "net.netfilter.nf_conntrack_max": 1000000
        "net.netfilter.nf_conntrack_buckets": 250000
        "net.netfilter.nf_conntrack_tcp_timeout_established": 86400
        "net.netfilter.nf_conntrack_tcp_timeout_close_wait": 3600
        # Network
        "net.ipv4.ip_forward": 1
        "net.ipv6.conf.all.forwarding": 1
        "net.bridge.bridge-nf-call-iptables": 1
        "net.bridge.bridge-nf-call-ip6tables": 1
        # RKE2 related sysctl overrides
        "vm.panic_on_oom": 0
        "vm.overcommit_memory": 1
        "kernel.panic": 10
        "kernel.panic_on_oops": 1
      fapolicyd: |
        # Allow RKE2 to function
        allow perm=any all : dir=/opt/cni/
        allow perm=any all : dir=/run/k3s/
        allow perm=any all : dir=/var/lib/kubelet/
        allow perm=any all : dir=/var/lib/rancher/
      files:
        # One set of RPMs and one tarball per architecture, each landing at the same target.
        # The selector decides which set a host receives; an entry without an arch selector
        # goes to every host.
        - source: https://rpm.rancher.io/rke2/latest/1.33/centos/9/x86_64/rke2-common-1.33.13~rke2r1-0.el9.x86_64.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-common-1.33.13~rke2r1-0.el9.x86_64.rpm
          shasum: 409dd5d8226d38d4ad2ffedd2bec98d35f4ec47b939e071749d5d6b0a04e18fd
          selector:
            package: rpm
            arch:
              - amd64
        - source: https://rpm.rancher.io/rke2/latest/1.33/centos/9/aarch64/rke2-common-1.33.13~rke2r1-0.el9.aarch64.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-common-1.33.13~rke2r1-0.el9.aarch64.rpm
          shasum: a2f8d9534245cf9978c0df6f6bfa799fd7ab5a5c6411b70a02ff09c6f84ee714
          selector:
            package: rpm
            arch:
              - arm64
        - source: https://rpm.rancher.io/rke2/latest/common/centos/9/noarch/rke2-selinux-0.22-1.el9.noarch.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-selinux-0.22-1.el9.noarch.rpm
          shasum: cb05b41bc3c3032392aec81258478a54fd121c563dfd2688153d5b2b925d69fc
          selector:
            package: rpm
        - source: https://rpm.rancher.io/rke2/latest/1.33/centos/9/x86_64/rke2-server-1.33.13~rke2r1-0.el9.x86_64.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-server-1.33.13~rke2r1-0.el9.x86_64.rpm
          shasum: 7ab1d00e69bd6551fb72aa503931d66d38ab3eeb9c6a4d1be3422c4626ad7675
          selector:
            package: rpm
            profile: controller
            arch:
              - amd64
        - source: https://rpm.rancher.io/rke2/latest/1.33/centos/9/aarch64/rke2-server-1.33.13~rke2r1-0.el9.aarch64.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-server-1.33.13~rke2r1-0.el9.aarch64.rpm
          shasum: 3cb2fb3be18da8c43f53880541eab17f86cf1054d181350682e80d198fd44a3b
          selector:
            package: rpm
            profile: controller
            arch:
              - arm64
        - source: https://rpm.rancher.io/rke2/latest/1.33/centos/9/x86_64/rke2-agent-1.33.13~rke2r1-0.el9.x86_64.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-agent-1.33.13~rke2r1-0.el9.x86_64.rpm
          shasum: 60e89d9b5560663f6fe98e0fc85abd4d8078539006914929909d96f54fc73d39
          selector:
            package: rpm
            profile: worker
            arch:
              - amd64
        - source: https://rpm.rancher.io/rke2/latest/1.33/centos/9/aarch64/rke2-agent-1.33.13~rke2r1-0.el9.aarch64.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-agent-1.33.13~rke2r1-0.el9.aarch64.rpm
          shasum: cbc117d820db186b5e159dccd6546ca31af6844071e27caf5c37b68688138021
          selector:
            package: rpm
            profile: worker
            arch:
              - arm64
        - source: target/rke2.linux-amd64.tar.gz
          extractPath: bin/rke2
          target: /usr/local/bin/rke2
          executable: true
          selector:
            package: binary
            arch:
              - amd64
        - source: target/rke2.linux-arm64.tar.gz
          extractPath: bin/rke2
          target: /usr/local/bin/rke2
          executable: true
          selector:
            package: binary
            arch:
              - arm64
        - source: target/rke2.linux-amd64.tar.gz
          extractPath: bin/rke2-killall.sh
          target: /usr/local/bin/rke2-killall.sh
          executable: true
          selector:
            package: binary
            arch:
              - amd64
        - source: target/rke2.linux-arm64.tar.gz
          extractPath: bin/rke2-killall.sh
          target: /usr/local/bin/rke2-killall.sh
          executable: true
          selector:
            package: binary
            arch:
              - arm64
        - source: target/rke2.linux-amd64.tar.gz
          extractPath: bin/rke2-uninstall.sh
          target: /usr/local/bin/rke2-uninstall.sh
          executable: true
          selector:
            package: binary
            arch:
              - amd64
        - source: target/rke2.linux-arm64.tar.gz
          extractPath: bin/rke2-uninstall.sh
          target: /usr/local/bin/rke2-uninstall.sh
          executable: true
          selector:
            package: binary
            arch:
              - arm64
        - source: target/rke2.linux-amd64.tar.gz
          extractPath: lib/systemd/system/rke2-server.service
          target: /etc/systemd/system/rke2-server.service
          symlinks:
            - /etc/systemd/system/multi-user.target.wants/rke2-server.service
          selector:
            package: binary
            profile: controller
            arch:
              - amd64
        - source: target/rke2.linux-arm64.tar.gz
          extractPath: lib/systemd/system/rke2-server.service
          target: /etc/systemd/system/rke2-server.service
          symlinks:
            - /etc/systemd/system/multi-user.target.wants/rke2-server.service
          selector:
            package: binary
            profile: controller
            arch:
              - arm64
        - source: target/rke2.linux-amd64.tar.gz
          extractPath: lib/systemd/system/rke2-agent.service
          target: /etc/systemd/system/rke2-agent.service
          symlinks:
            - /etc/systemd/system/multi-user.target.wants/rke2-agent.service
          selector:
            package: binary
            profile: worker
            arch:
              - amd64
        - source: target/rke2.linux-arm64.tar.gz
          extractPath: lib/systemd/system/rke2-agent.service
          target: /etc/systemd/system/rke2-agent.service
          symlinks:
            - /etc/systemd/system/multi-user.target.wants/rke2-agent.service
          selector:
            package: binary
            profile: worker
            arch:
              - arm64
        - source: https://rpm.rancher.io/rke2/latest/common/centos/9/noarch/rke2-selinux-0.22-1.el9.noarch.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-selinux-0.22-1.el9.noarch.rpm
          shasum: cb05b41bc3c3032392aec81258478a54fd121c563dfd2688153d5b2b925d69fc
          selector:
            package: binary
    imageConfig:
      path: /var/lib/rancher/rke2/agent/images
      compression: none
      images:
        - docker.io/rancher/rke2-runtime:v1.33.13-rke2r1
        - docker.io/rancher/hardened-kubernetes:v1.33.13-rke2r1-build20260612
        - docker.io/rancher/hardened-coredns:v1.14.4-build20260610
        - docker.io/rancher/hardened-cluster-autoscaler:v1.10.3-build20260604
        - docker.io/rancher/hardened-dns-node-cache:1.26.8-build20260608
        - docker.io/rancher/hardened-etcd:v3.6.12-k3s1-build20260603
        - docker.io/rancher/hardened-k8s-metrics-server:v0.8.1-build20260604
        - docker.io/rancher/hardened-addon-resizer:1.8.23-build20260604
        - docker.io/rancher/klipper-helm:v0.11.1-build20260615
        - docker.io/rancher/klipper-lb:v0.4.17
        - docker.io/rancher/mirrored-pause:3.6
        - docker.io/rancher/kube-webhook-certgen:v1.14.5-hardened2
        - docker.io/rancher/nginx-ingress-controller:v1.14.5-hardened2
        - docker.io/rancher/rke2-cloud-provider:v1.33.11-0.20260415182038-2566e39d309b-build20260416
        - docker.io/rancher/hardened-snapshot-controller:v8.6.0-build20260608
        # cilium cni and add-on images
        - docker.io/rancher/mirrored-cilium-certgen:v0.4.3
        - docker.io/rancher/mirrored-cilium-cilium:v1.19.4
        - docker.io/rancher/mirrored-cilium-cilium-envoy:v1.36.6-1778235340-b87d1e32f522b33bd51701c6476d199326f01496
        - docker.io/rancher/mirrored-cilium-clustermesh-apiserver:v1.19.4
        - docker.io/rancher/mirrored-cilium-hubble-relay:v1.19.4
        - docker.io/rancher/mirrored-cilium-hubble-ui:v0.13.5
        - docker.io/rancher/mirrored-cilium-hubble-ui-backend:v0.13.5
