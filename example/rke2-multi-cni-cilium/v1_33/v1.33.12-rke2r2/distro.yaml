---
# yaml-language-server: $schema=https://raw.githubusercontent.com/colonel-byte/cargoship/refs/heads/main/schema/zarf-v1alpha1-distro-package-schema.json
apiVersion: zarf.dev/v1alpha1
kind: ZarfDistro
metadata:
  name: rancher-rke2-multi-cni-cilium
  version: 1.33.12-rke2r2
  architectures:
    - amd64
    - arm64
spec:
  type: rke2
  version: 1.33.12-rke2r2
  # The values a cluster may override in its inventory file, under spec.config.values,
  # or on the command line with --values. Every flavor exposes the bundled charts rke2
  # installs; the cilium flavors also expose the chart's own settings, so the same
  # package installs with or without encryption, hubble ui, and the rest, without being
  # rebuilt.
  values:
    files:
      - values.yaml
    schema: values.schema.json
    mappings:
      # A mapping copies the value as it stands, list included, so the charts a cluster
      # names under addons.disabled become the engine's own disable list.
      - source: .addons.disabled
        target: .config.disable
      - source: .podSecurity.defaults.enforce
        target: .podSecurity.plugins[0].configuration.defaults.enforce
      - source: .podSecurity.defaults.audit
        target: .podSecurity.plugins[0].configuration.defaults.audit
      - source: .podSecurity.defaults.warn
        target: .podSecurity.plugins[0].configuration.defaults.warn
  config:
    engine:
      config:
        cluster-cidr: 10.42.0.0/16
        cluster-domain: cluster.local
        cni:
          - cilium
        disable-cloud-controller: true
        disable-kube-proxy: true
        # There is no disable list here: .addons.disabled supplies it, and this package's
        # own values.yaml carries the entry that used to be written in this file.
        embedded-registry: false
        etcd-arg:
          - "quota-backend-bytes=8589934592" # 8GB
          - "auto-compaction-retention=1h"
        kube-apiserver-arg:
          - anonymous-auth=false
          - audit-log-mode=blocking-strict
          - audit-log-maxage=30
          - authorization-mode=RBAC,Node
          - "tls-min-version=VersionTLS12"
          - "service-account-extend-token-expiration=false"
          - "tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
        kube-controller-manager-arg:
          - "tls-min-version=VersionTLS12"
          - "tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
          - bind-address=127.0.0.1
          - use-service-account-credentials=true
        kube-proxy-arg:
          - "ipvs-strict-arp=true"
        kube-scheduler-arg:
          - "tls-min-version=VersionTLS12"
          - "tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
        kubelet-arg:
          - authorization-mode=Webhook
          - anonymous-auth=false
          - streaming-connection-idle-timeout=5m
          - read-only-port=0
        profile: cis
        protect-kernel-defaults: true
        selinux: true
        service-cidr: 10.43.0.0/16
        write-kubeconfig-mode: "0600"
      audit:
        rules:
          - level: None
      podSecurity:
        plugins:
          - name: PodSecurity
            configuration:
              apiVersion: pod-security.admission.config.k8s.io/v1beta1
              kind: PodSecurityConfiguration
              defaults:
                enforce: "restricted"
                enforce-version: "latest"
                audit: "restricted"
                audit-version: "latest"
                warn: "restricted"
                warn-version: "latest"
              exemptions:
                usernames: []
                runtimeClasses: []
                namespaces:
                  - kube-system
                  - rook-ceph
                  - zarf
      manifest:
        # This flavor drives the chart from .Values rather than from mappings. The block
        # is a string, so cargoship renders it whole at install time and a value can
        # decide whether an entire subtree is written -- which one mapping per leaf
        # cannot express. The chart values themselves are unchanged. The addons list
        # above stays a mapping regardless: a package may use both mechanisms, and each
        # value is spent on whichever one says what it means.
        rke2-cilium: |-
          kubeProxyReplacement: true
          k8sServiceHost: "localhost"
          k8sServicePort: 6443
          l2announcements:
            enabled: {{ .Values.cilium.l2announcements.enabled }}
          encryption:
            enabled: {{ .Values.cilium.encryption.enabled }}
            type: wireguard
          tolerations:
            - operator: Exists
          operator:
            tolerations:
              - operator: Exists
          cni:
            exclusive: false
          bandwidthManager:
            enabled: false
          bpf:
            masquerade: true
          socketLB:
            hostNamespaceOnly: true
            enabled: true
          localRedirectPolicies:
            enabled: true
          hostFirewall:
            enabled: false
          enablePolicy: default
          {{- if .Values.cilium.hubble.ui.enabled }}
          hubble:
            enabled: true
            relay:
              enabled: true
              tolerations:
                - operator: Exists
            ui:
              enabled: true
              frontend:
                server:
                  ipv6:
                    enabled: {{ .Values.cilium.hubble.ui.ipv6 }}
              tolerations:
                - operator: Exists
          {{- else }}
          # Hubble's relay and web interface are what the observability images are for,
          # so a cluster that does not want the interface does not run either.
          hubble:
            enabled: false
          {{- end }}
    os:
      env:
        CRI_CONFIG_FILE: |-
          /var/lib/rancher/rke2/agent/etc/crictl.yaml
        KUBECONFIG: |-
          /etc/rancher/rke2/rke2.yaml
        RKE2_CONFIG_FILE: |-
          /etc/rancher/rke2/config.yaml
      sysctl:
        # Istio related sysctl overrides
        "fs.inotify.max_user_watches": 11048576
        "fs.inotify.max_user_instances": 8192
        # Misc performance
        "vm.max_map_count": 262144
        "fs.file-max": 2097152
        # Network tuning
        "net.core.somaxconn": 32768
        "net.ipv4.tcp_max_syn_backlog": 8192
        "net.core.netdev_max_backlog": 16384
        # NFTABLES
        "net.netfilter.nf_conntrack_max": 1000000
        "net.netfilter.nf_conntrack_buckets": 250000
        "net.netfilter.nf_conntrack_tcp_timeout_established": 86400
        "net.netfilter.nf_conntrack_tcp_timeout_close_wait": 3600
        # Network
        "net.ipv4.ip_forward": 1
        "net.ipv6.conf.all.forwarding": 1
        "net.bridge.bridge-nf-call-iptables": 1
        "net.bridge.bridge-nf-call-ip6tables": 1
        # RKE2 related sysctl overrides
        "vm.panic_on_oom": 0
        "vm.overcommit_memory": 1
        "kernel.panic": 10
        "kernel.panic_on_oops": 1
      fapolicyd: |
        # Allow RKE2 to function
        allow perm=any all : dir=/opt/cni/
        allow perm=any all : dir=/run/k3s/
        allow perm=any all : dir=/var/lib/kubelet/
        allow perm=any all : dir=/var/lib/rancher/
