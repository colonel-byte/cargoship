apiVersion: content.hauler.cattle.io/v1
kind: Images
metadata:
  name: multi-cni-cilium-core
  annotations:
    # The registry every image below is collected from. Hauler supplies it for the unqualified
    # names in this document, so pointing this at a mirror that carries the same repository
    # paths redirects the whole document -- and `cargoship create --registry-override
    # docker.io=<mirror>` then looks the collected images up under the reference the mirror
    # recorded. See docs/guides/content-store.md.
    hauler.dev/registry: docker.io
spec:
  images:
    - name: rancher/rke2-runtime:v1.37.2-rke2r1
    - name: rancher/hardened-kubernetes:v1.37.2-rke2r1-build20261029
    - name: rancher/hardened-coredns:v1.14.7-build20261020
    - name: rancher/hardened-cluster-autoscaler:v1.11.0-build20261020
    - name: rancher/hardened-dns-node-cache:1.27.2-r1-build20261022
    - name: rancher/hardened-etcd:v3.7.1-k3s3-build20261020
    - name: rancher/hardened-k8s-metrics-server:v0.9.0-build20261020
    - name: rancher/hardened-addon-resizer:1.8.24-build20261021
    - name: rancher/klipper-helm:v0.13.3-build20261021
    - name: rancher/klipper-lb:v0.4.17
    - name: rancher/mirrored-pause:3.10.2
    - name: rancher/rke2-cloud-provider:v1.37.2-0.20261016152943-06368081f0b2-build20261021
    - name: rancher/rke2-security-responder:v0.1.9
    - name: rancher/hardened-snapshot-controller:v8.7.0-build20261021
    - name: rancher/hardened-traefik:v3.7.16-build20261028
