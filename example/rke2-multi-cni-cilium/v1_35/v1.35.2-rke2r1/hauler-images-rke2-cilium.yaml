apiVersion: content.hauler.cattle.io/v1
kind: Images
metadata:
  name: multi-cni-cilium-rke2-cilium
  annotations:
    # The registry every image below is collected from. Hauler supplies it for the unqualified
    # names in this document, so pointing this at a mirror that carries the same repository
    # paths redirects the whole document -- and `cargoship create --registry-override
    # docker.io=<mirror>` then looks the collected images up under the reference the mirror
    # recorded. See docs/guides/content-store.md.
    hauler.dev/registry: docker.io
spec:
  images:
    - name: rancher/mirrored-cilium-certgen:v0.3.2
    - name: rancher/mirrored-cilium-cilium:v1.19.1
    - name: rancher/mirrored-cilium-cilium-envoy:v1.35.9-1770979049-232ed4a26881e4ab4f766f251f258ed424fff663
    - name: rancher/mirrored-cilium-clustermesh-apiserver:v1.19.1
    - name: rancher/mirrored-cilium-hubble-relay:v1.19.1
    - name: rancher/mirrored-cilium-hubble-ui:v0.13.3
    - name: rancher/mirrored-cilium-hubble-ui-backend:v0.13.3
    - name: rancher/mirrored-cilium-operator-aws:v1.19.1
    - name: rancher/mirrored-cilium-operator-azure:v1.19.1
    - name: rancher/mirrored-cilium-operator-generic:v1.19.1
    - name: rancher/hardened-cni-plugins:v1.9.0-build20260206
