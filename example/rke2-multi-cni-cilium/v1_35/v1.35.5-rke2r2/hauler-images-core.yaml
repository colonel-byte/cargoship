apiVersion: content.hauler.cattle.io/v1
kind: Images
metadata:
  name: multi-cni-cilium-core
  annotations:
    # The registry every image below is collected from. Hauler supplies it for the unqualified
    # names in this document, so pointing this at a mirror that carries the same repository
    # paths redirects the whole document -- and `cargoship create --registry-override
    # docker.io=<mirror>` then looks the collected images up under the reference the mirror
    # recorded. See docs/guides/content-store.md.
    hauler.dev/registry: docker.io
spec:
  images:
    - name: rancher/rke2-runtime:v1.35.5-rke2r2
    - name: rancher/hardened-kubernetes:v1.35.5-rke2r2-build20260521
    - name: rancher/hardened-coredns:v1.14.3-build20260511
    - name: rancher/hardened-cluster-autoscaler:v1.10.3-build20260511
    - name: rancher/hardened-dns-node-cache:1.26.8-build20260511
    - name: rancher/hardened-etcd:v3.6.7-k3s1-build20260512
    - name: rancher/hardened-k8s-metrics-server:v0.8.1-build20260513
    - name: rancher/hardened-addon-resizer:1.8.23-build20260511
    - name: rancher/klipper-helm:v0.10.0-build20260513
    - name: rancher/klipper-lb:v0.4.17
    - name: rancher/mirrored-pause:3.6
    - name: rancher/kube-webhook-certgen:v1.14.5-hardened2
    - name: rancher/nginx-ingress-controller:v1.14.5-hardened2
    - name: rancher/rke2-cloud-provider:v1.35.4-0.20260415195656-e51c0636351d-build20260415
    - name: rancher/hardened-snapshot-controller:v8.5.0-build20260513
