apiVersion: content.hauler.cattle.io/v1
kind: Images
metadata:
  name: multi-cni-cilium-core
  annotations:
    # The registry every image below is collected from. Hauler supplies it for the unqualified
    # names in this document, so pointing this at a mirror that carries the same repository
    # paths redirects the whole document -- and `cargoship create --registry-override
    # docker.io=<mirror>` then looks the collected images up under the reference the mirror
    # recorded. See docs/guides/content-store.md.
    hauler.dev/registry: docker.io
spec:
  images:
    - name: rancher/rke2-runtime:v1.35.0-rke2r1
    - name: rancher/hardened-kubernetes:v1.35.0-rke2r1-build20251218
    - name: rancher/hardened-coredns:v1.13.1-build20251204
    - name: rancher/hardened-cluster-autoscaler:v1.10.2-build20251204
    - name: rancher/hardened-dns-node-cache:1.26.7-build20251204
    - name: rancher/hardened-etcd:v3.6.6-k3s1-build20251210
    - name: rancher/hardened-k8s-metrics-server:v0.8.0-build20251204
    - name: rancher/hardened-addon-resizer:1.8.23-build20251204
    - name: rancher/klipper-helm:v0.9.12-build20251215
    - name: rancher/klipper-lb:v0.4.13
    - name: rancher/mirrored-pause:3.6
    - name: rancher/mirrored-ingress-nginx-kube-webhook-certgen:v1.6.5
    - name: rancher/nginx-ingress-controller:v1.13.5-hardened2
    - name: rancher/rke2-cloud-provider:v1.35.0-rc1.0.20251218152248-a6c6cd15c0c4-build20251219
    - name: rancher/mirrored-sig-storage-snapshot-controller:v8.2.0
