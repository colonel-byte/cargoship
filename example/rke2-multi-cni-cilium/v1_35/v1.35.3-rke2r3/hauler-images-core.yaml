apiVersion: content.hauler.cattle.io/v1
kind: Images
metadata:
  name: multi-cni-cilium-core
  annotations:
    # The registry every image below is collected from. Hauler supplies it for the unqualified
    # names in this document, so pointing this at a mirror that carries the same repository
    # paths redirects the whole document -- and `cargoship create --registry-override
    # docker.io=<mirror>` then looks the collected images up under the reference the mirror
    # recorded. See docs/guides/content-store.md.
    hauler.dev/registry: docker.io
spec:
  images:
    - name: rancher/rke2-runtime:v1.35.3-rke2r3
    - name: rancher/hardened-kubernetes:v1.35.3-rke2r3-build20260407
    - name: rancher/hardened-coredns:v1.14.2-build20260310
    - name: rancher/hardened-cluster-autoscaler:v1.10.3-build20260206
    - name: rancher/hardened-dns-node-cache:1.26.7-build20260310
    - name: rancher/hardened-etcd:v3.6.7-k3s1-build20260227
    - name: rancher/hardened-k8s-metrics-server:v0.8.1-build20260206
    - name: rancher/hardened-addon-resizer:1.8.23-build20260206
    - name: rancher/klipper-helm:v0.9.14-build20260309
    - name: rancher/klipper-lb:v0.4.15
    - name: rancher/mirrored-pause:3.6
    - name: rancher/kube-webhook-certgen:v1.14.5-hardened1
    - name: rancher/nginx-ingress-controller:v1.14.5-hardened1
    - name: rancher/rke2-cloud-provider:v1.35.1-0.20260211145923-50fa2d70c239-build20260211
    - name: rancher/hardened-snapshot-controller:v8.4.0-build20260205
