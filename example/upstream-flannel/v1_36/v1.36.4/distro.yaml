# yaml-language-server: $schema=https://raw.githubusercontent.com/colonel-byte/cargoship/refs/heads/main/schema/zarf-v1alpha1-distro-package-schema.json
kind: ZarfDistro
metadata:
  name: upstream-flannel
  version: 1.36.4
  architectures:
    - amd64
    - arm64
spec:
  version: 1.36.4
  type: upstream
  config:
    # Upstream ships no CNI of its own, and a cluster without one comes up with every pod stuck
    # at ContainerCreating. So the package carries one: the manifest below goes to the
    # controllers, and spec.config.manifests is what tells cargoship to kubectl apply it from
    # the leader once kubeadm has formed the cluster. The images it runs are in
    # imageConfig.images further down, read out of this same manifest when it was rendered.
    files:
      - source: https://github.com/flannel-io/flannel/releases/download/v0.28.10/kube-flannel.yml
        target: /etc/kubernetes/manifests-cni/kube-flannel.yml
        shasum: 393bdbce53eb50c8eb97dd513b218518b7d6e7985dc7b889be956e112a711084
        selector:
          profile: controller
    manifests:
      - /etc/kubernetes/manifests-cni/kube-flannel.yml
    engine:
      config:
        networking:
          # flannel's manifest hardcodes this pod CIDR, so kubeadm is told the same one.
          # Disagreeing here is not an error either side reports: the cluster forms and pod
          # traffic silently does not route.
          podSubnet: 10.244.0.0/16
    os:
      files:
        # Every file this package installs is architecture specific, so each one is listed once per
        # architecture with a selector saying which hosts it belongs to. A host receives only the
        # entries its own architecture selects, and cargoship refuses a selector naming an
        # architecture the package does not declare above. Each entry carries the sha256 its
        # publisher lists for that file, so cargoship verifies what it downloads.
        - source: https://pkgs.k8s.io/core:/stable:/v1.36/deb/amd64/cri-tools_1.36.0-1.1_amd64.deb
          target: /var/lib/kubernetes/deb/cri-tools_1.36.0-1.1_amd64.deb
          shasum: 8cff9279de7767239e11bf9c21016579a4246e04e7da0c500c7a3f8491db986a
          selector:
            package: apt
            arch:
              - amd64
        - source: https://pkgs.k8s.io/core:/stable:/v1.36/deb/amd64/kubernetes-cni_1.9.1-1.1_amd64.deb
          target: /var/lib/kubernetes/deb/kubernetes-cni_1.9.1-1.1_amd64.deb
          shasum: 4cd72d8cef4499d3dc410874287b40e8b4241e0772938c5820cbee37986c1d93
          selector:
            package: apt
            arch:
              - amd64
        - source: https://pkgs.k8s.io/core:/stable:/v1.36/deb/amd64/kubeadm_1.36.4-1.1_amd64.deb
          target: /var/lib/kubernetes/deb/kubeadm_1.36.4-1.1_amd64.deb
