        - source: https://pkgs.k8s.io/core:/stable:/v1.36/deb/amd64/kubelet_1.36.4-1.1_amd64.deb
          target: /var/lib/kubernetes/deb/kubelet_1.36.4-1.1_amd64.deb
          shasum: 0e685f75ed2225508538df2c01ce8cb698979021fb8ced2fc3fef8dd569424d4
          selector:
            package: apt
            arch:
              - amd64
        - source: https://pkgs.k8s.io/core:/stable:/v1.36/deb/amd64/kubectl_1.36.4-1.1_amd64.deb
          target: /var/lib/kubernetes/deb/kubectl_1.36.4-1.1_amd64.deb
