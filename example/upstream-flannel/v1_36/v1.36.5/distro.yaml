        - source: https://pkgs.k8s.io/core:/stable:/v1.36/deb/amd64/kubelet_1.36.5-1.1_amd64.deb
          target: /var/lib/kubernetes/deb/kubelet_1.36.5-1.1_amd64.deb
          shasum: dd46254567ee60672c0737a4b5392fae7f3419a876ab6885c48178501ac2fd64
          selector:
            package: apt
            arch:
              - amd64
        - source: https://pkgs.k8s.io/core:/stable:/v1.36/deb/amd64/kubectl_1.36.5-1.1_amd64.deb
          target: /var/lib/kubernetes/deb/kubectl_1.36.5-1.1_amd64.deb
          shasum: e633cdbcb535b0fdf8bd9aa643cfd0ad080889fddb6794d2af0bbaaf110e7956
          selector:
