        - source: https://pkgs.k8s.io/core:/stable:/v1.36/deb/amd64/kubelet_1.36.2-2.1_amd64.deb
          target: /var/lib/kubernetes/deb/kubelet_1.36.2-2.1_amd64.deb
          shasum: e60c79fa93b6538d3bae79cb325beafe08bc084f8501fe16a3f203af598f6f50
          selector:
            package: apt
            arch:
              - amd64
        - source: https://pkgs.k8s.io/core:/stable:/v1.36/deb/amd64/kubectl_1.36.2-2.1_amd64.deb
          target: /var/lib/kubernetes/deb/kubectl_1.36.2-2.1_amd64.deb
          shasum: e678e88e6e65fb49f54985994eacaa5555574f0ceb01772208f328037878b58c
          selector:
