        - source: https://pkgs.k8s.io/core:/stable:/v1.36/deb/amd64/kubeadm_1.36.2-2.1_amd64.deb
          target: /var/lib/kubernetes/deb/kubeadm_1.36.2-2.1_amd64.deb
