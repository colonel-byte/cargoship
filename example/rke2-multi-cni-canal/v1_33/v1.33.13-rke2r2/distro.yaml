# This file is generated in magefiles/templates/rke2-distro.yaml.tmpl, versions may need to updated over time.

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/colonel-byte/cargoship/refs/heads/main/schema/zarf-v1alpha1-distro-package-schema.json
apiVersion: zarf.dev/v1alpha1
kind: ZarfDistro
metadata:
  name: rancher-rke2-multi-cni-canal
  version: 1.33.13-rke2r2
  architectures:
    - amd64
    - arm64
spec:
  type: rke2
  version: 1.33.13-rke2r2
  # The values a cluster may override in its inventory file, under spec.config.values,
  # or on the command line with --values. Every flavor exposes the bundled charts rke2
  # installs; the cilium flavors also expose the chart's own settings, so the same
  # package installs with or without encryption, hubble ui, and the rest, without being
  # rebuilt.
  values:
    files:
      - values.yaml
    schema: values.schema.json
    mappings:
      # A mapping copies the value as it stands, list included, so the charts a cluster
      # names under addons.disabled become the engine's own disable list.
      - source: .addons.disabled
        target: .config.disable
      - source: .podSecurity.defaults.enforce
        target: .podSecurity.plugins[0].configuration.defaults.enforce
      - source: .podSecurity.defaults.audit
        target: .podSecurity.plugins[0].configuration.defaults.audit
      - source: .podSecurity.defaults.warn
        target: .podSecurity.plugins[0].configuration.defaults.warn
  actions:
    onCreate:
      before:
        - description: pull rke2 tar-ball
          cmd: |-
            rm -rf   target
            mkdir -p target
            echo https://github.com/rancher/rke2/releases/download/v1.33.13%2Brke2r2/rke2.linux-amd64.tar.gz
            curl -L -o ./target/rke2.linux-amd64.tar.gz https://github.com/rancher/rke2/releases/download/v1.33.13%2Brke2r2/rke2.linux-amd64.tar.gz
            echo https://github.com/rancher/rke2/releases/download/v1.33.13%2Brke2r2/rke2.linux-arm64.tar.gz
            curl -L -o ./target/rke2.linux-arm64.tar.gz https://github.com/rancher/rke2/releases/download/v1.33.13%2Brke2r2/rke2.linux-arm64.tar.gz
      after:
        - description: clean up after
          cmd: |-
            rm -rf   target
  config:
    engine:
      config:
        cluster-cidr: 10.42.0.0/16
        cluster-domain: cluster.local
        cni:
          - canal
        disable-cloud-controller: true
        # There is no disable list here: .addons.disabled supplies it, and this package's
        # own values.yaml carries the entry that used to be written in this file.
        embedded-registry: false
        etcd-arg:
          - "quota-backend-bytes=8589934592" # 8GB
          - "auto-compaction-retention=1h"
        kube-apiserver-arg:
          - anonymous-auth=false
          - audit-log-mode=blocking-strict
          - audit-log-maxage=30
          - authorization-mode=RBAC,Node
          - "tls-min-version=VersionTLS12"
          - "service-account-extend-token-expiration=false"
          - "tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
        kube-controller-manager-arg:
          - "tls-min-version=VersionTLS12"
          - "tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
          - bind-address=127.0.0.1
          - use-service-account-credentials=true
        kube-proxy-arg:
          - "ipvs-strict-arp=true"
        kube-scheduler-arg:
          - "tls-min-version=VersionTLS12"
          - "tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
        kubelet-arg:
          - authorization-mode=Webhook
          - anonymous-auth=false
          - streaming-connection-idle-timeout=5m
          - read-only-port=0
        profile: cis
        protect-kernel-defaults: true
        selinux: true
        service-cidr: 10.43.0.0/16
        write-kubeconfig-mode: "0600"
      audit:
        rules:
          - level: None
      podSecurity:
        plugins:
          - name: PodSecurity
            configuration:
              apiVersion: pod-security.admission.config.k8s.io/v1beta1
              kind: PodSecurityConfiguration
              defaults:
                enforce: "restricted"
                enforce-version: "latest"
                audit: "restricted"
                audit-version: "latest"
                warn: "restricted"
                warn-version: "latest"
              exemptions:
                usernames: []
                runtimeClasses: []
                namespaces:
                  - kube-system
                  - rook-ceph
                  - zarf
    os:
      env:
        CRI_CONFIG_FILE: |-
          /var/lib/rancher/rke2/agent/etc/crictl.yaml
        KUBECONFIG: |-
          /etc/rancher/rke2/rke2.yaml
        RKE2_CONFIG_FILE: |-
          /etc/rancher/rke2/config.yaml
      sysctl:
        # Istio related sysctl overrides
        "fs.inotify.max_user_watches": 11048576
        "fs.inotify.max_user_instances": 8192
        # Misc performance
        "vm.max_map_count": 262144
        "fs.file-max": 2097152
        # Network tuning
        "net.core.somaxconn": 32768
        "net.ipv4.tcp_max_syn_backlog": 8192
        "net.core.netdev_max_backlog": 16384
        # NFTABLES
        "net.netfilter.nf_conntrack_max": 1000000
        "net.netfilter.nf_conntrack_buckets": 250000
        "net.netfilter.nf_conntrack_tcp_timeout_established": 86400
        "net.netfilter.nf_conntrack_tcp_timeout_close_wait": 3600
        # Network
        "net.ipv4.ip_forward": 1
        "net.ipv6.conf.all.forwarding": 1
        "net.bridge.bridge-nf-call-iptables": 1
        "net.bridge.bridge-nf-call-ip6tables": 1
        # RKE2 related sysctl overrides
        "vm.panic_on_oom": 0
        "vm.overcommit_memory": 1
        "kernel.panic": 10
        "kernel.panic_on_oops": 1
      fapolicyd: |
        # Allow RKE2 to function
        allow perm=any all : dir=/opt/cni/
        allow perm=any all : dir=/run/k3s/
        allow perm=any all : dir=/var/lib/kubelet/
        allow perm=any all : dir=/var/lib/rancher/
      files:
        # One set of RPMs and one tarball per architecture, each landing at the same target.
        # The selector decides which set a host receives; an entry without an arch selector
        # goes to every host.
        - source: https://rpm.rancher.io/rke2/latest/1.33/centos/9/x86_64/rke2-common-1.33.13~rke2r2-0.el9.x86_64.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-common-1.33.13~rke2r2-0.el9.x86_64.rpm
          shasum: b2f2690d8bf4e8032f27e96581ab3d8edbaecef933d12b064247f3047fc4741d
          selector:
            package: rpm
            arch:
              - amd64
        - source: https://rpm.rancher.io/rke2/latest/1.33/centos/9/aarch64/rke2-common-1.33.13~rke2r2-0.el9.aarch64.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-common-1.33.13~rke2r2-0.el9.aarch64.rpm
          shasum: b52a56648fe47f89d2ca328a5a7e3a49b4bfa27232bc9cae63e0ec333f00ea9b
          selector:
            package: rpm
            arch:
              - arm64
        - source: https://rpm.rancher.io/rke2/latest/common/centos/9/noarch/rke2-selinux-0.22-1.el9.noarch.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-selinux-0.22-1.el9.noarch.rpm
          shasum: cb05b41bc3c3032392aec81258478a54fd121c563dfd2688153d5b2b925d69fc
          selector:
            package: rpm
        - source: https://rpm.rancher.io/rke2/latest/1.33/centos/9/x86_64/rke2-server-1.33.13~rke2r2-0.el9.x86_64.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-server-1.33.13~rke2r2-0.el9.x86_64.rpm
          shasum: e80e1aab017dd715c09a76449ba8801586508c2ff3ff24458b37982eb38c949a
          selector:
            package: rpm
            profile: controller
            arch:
              - amd64
        - source: https://rpm.rancher.io/rke2/latest/1.33/centos/9/aarch64/rke2-server-1.33.13~rke2r2-0.el9.aarch64.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-server-1.33.13~rke2r2-0.el9.aarch64.rpm
          shasum: afc5c838c64e5b26322200dcb2f46baa097b66092738092b44003756f93ced6e
          selector:
            package: rpm
            profile: controller
            arch:
              - arm64
        - source: https://rpm.rancher.io/rke2/latest/1.33/centos/9/x86_64/rke2-agent-1.33.13~rke2r2-0.el9.x86_64.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-agent-1.33.13~rke2r2-0.el9.x86_64.rpm
          shasum: d0494a9a21773027ed4dd7e445c6b746412424864a3ddda01498d1be2b2c7516
          selector:
            package: rpm
            profile: worker
            arch:
              - amd64
        - source: https://rpm.rancher.io/rke2/latest/1.33/centos/9/aarch64/rke2-agent-1.33.13~rke2r2-0.el9.aarch64.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-agent-1.33.13~rke2r2-0.el9.aarch64.rpm
          shasum: 7e260ab3b2a3ecef1e9db1e87c036200af9d5dfc563839ab2b6902401863ebb8
          selector:
            package: rpm
            profile: worker
            arch:
              - arm64
        - source: target/rke2.linux-amd64.tar.gz
          extractPath: bin/rke2
          target: /usr/local/bin/rke2
          executable: true
          selector:
            package: binary
            arch:
              - amd64
        - source: target/rke2.linux-arm64.tar.gz
          extractPath: bin/rke2
          target: /usr/local/bin/rke2
          executable: true
          selector:
            package: binary
            arch:
              - arm64
        - source: target/rke2.linux-amd64.tar.gz
          extractPath: bin/rke2-killall.sh
          target: /usr/local/bin/rke2-killall.sh
          executable: true
          selector:
            package: binary
            arch:
              - amd64
        - source: target/rke2.linux-arm64.tar.gz
          extractPath: bin/rke2-killall.sh
          target: /usr/local/bin/rke2-killall.sh
          executable: true
          selector:
            package: binary
            arch:
              - arm64
        - source: target/rke2.linux-amd64.tar.gz
          extractPath: bin/rke2-uninstall.sh
          target: /usr/local/bin/rke2-uninstall.sh
          executable: true
          selector:
            package: binary
            arch:
              - amd64
        - source: target/rke2.linux-arm64.tar.gz
          extractPath: bin/rke2-uninstall.sh
          target: /usr/local/bin/rke2-uninstall.sh
          executable: true
          selector:
            package: binary
            arch:
              - arm64
        - source: target/rke2.linux-amd64.tar.gz
          extractPath: lib/systemd/system/rke2-server.service
          target: /etc/systemd/system/rke2-server.service
          symlinks:
            - /etc/systemd/system/multi-user.target.wants/rke2-server.service
          selector:
            package: binary
            profile: controller
            arch:
              - amd64
        - source: target/rke2.linux-arm64.tar.gz
          extractPath: lib/systemd/system/rke2-server.service
          target: /etc/systemd/system/rke2-server.service
          symlinks:
            - /etc/systemd/system/multi-user.target.wants/rke2-server.service
          selector:
            package: binary
            profile: controller
            arch:
              - arm64
        - source: target/rke2.linux-amd64.tar.gz
          extractPath: lib/systemd/system/rke2-agent.service
          target: /etc/systemd/system/rke2-agent.service
          symlinks:
            - /etc/systemd/system/multi-user.target.wants/rke2-agent.service
          selector:
            package: binary
            profile: worker
            arch:
              - amd64
        - source: target/rke2.linux-arm64.tar.gz
          extractPath: lib/systemd/system/rke2-agent.service
          target: /etc/systemd/system/rke2-agent.service
          symlinks:
            - /etc/systemd/system/multi-user.target.wants/rke2-agent.service
          selector:
            package: binary
            profile: worker
            arch:
              - arm64
        - source: https://rpm.rancher.io/rke2/latest/common/centos/9/noarch/rke2-selinux-0.22-1.el9.noarch.rpm
          target: /var/lib/rancher/rke2/rpm/rke2-selinux-0.22-1.el9.noarch.rpm
          shasum: cb05b41bc3c3032392aec81258478a54fd121c563dfd2688153d5b2b925d69fc
          selector:
            package: binary
    imageConfig:
      path: /var/lib/rancher/rke2/agent/images
      compression: none
      images:
        - docker.io/rancher/rke2-runtime:v1.33.13-rke2r2
        - docker.io/rancher/hardened-kubernetes:v1.33.13-rke2r2-build20260723
        - docker.io/rancher/hardened-coredns:v1.14.6-build20260722
        - docker.io/rancher/hardened-cluster-autoscaler:v1.10.3-build20260717
        - docker.io/rancher/hardened-dns-node-cache:1.26.8-build20260722
        - docker.io/rancher/hardened-etcd:v3.6.14-k3s1-build20260723
        - docker.io/rancher/hardened-k8s-metrics-server:v0.9.0-build20260722
        - docker.io/rancher/hardened-addon-resizer:1.8.23-build20260717
        - docker.io/rancher/klipper-helm:v0.13.3-build20260727
        - docker.io/rancher/klipper-lb:v0.4.17
        - docker.io/rancher/mirrored-pause:3.10.2
        - docker.io/rancher/kube-webhook-certgen:v1.14.5-hardened2
        - docker.io/rancher/nginx-ingress-controller:v1.14.5-hardened2
        - docker.io/rancher/rke2-cloud-provider:v1.33.13-0.20260610231102-b1a9339db253-build20260710
        - docker.io/rancher/hardened-snapshot-controller:v8.6.0-build20260722
        # canal cni and add-on images
        - docker.io/rancher/hardened-calico:v3.32.1-build20260722
        - docker.io/rancher/hardened-flannel:v0.28.8-build20260722
